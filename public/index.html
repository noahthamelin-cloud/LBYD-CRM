<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E3B30">
<title>LBYD CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* ---------- LOOK: Basalt (matches the onboarding deck) ---------- */
:root{
  --moss:#2E3B30; --moss2:#43554A; --moss3:#7D8F7E;
  --stone:#E3E2DA; --stone2:#D2D1C7; --paper:#F7F7F3;
  --ink:#1C221D; --mute:#666F68; --line:#CBCAC0;
  --ochre:#B9852F; --ochre-soft:#F0E3C6; --rust:#A4472F; --rust-soft:#F2DDD6; --ok:#4F7A45; --ok-soft:#DDE8D7;
  --f:'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--stone);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--moss2)}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* shell */
.demo{background:var(--ochre);color:#1C1A12;font-size:13px;padding:7px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.demo b{font-weight:700}
.app{display:grid;grid-template-columns:232px 1fr;min-height:calc(100% - 34px)}
.side{background:var(--moss);color:#E9EBE4}
.sidein{padding:22px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:21px;line-height:1.02;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:#AEBBAE;margin-top:6px;letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.addbig{justify-content:center;padding:13px 14px;font-size:15px;width:100%}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font-weight:500;color:#C9D1C6;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--moss2);color:#fff}
.nav button.on{background:#F7F7F3;color:var(--moss)}
.nav .n{font-size:12px;background:var(--ochre);color:#1C1A12;border-radius:20px;padding:1px 8px;font-weight:700}
.who{margin-top:auto;font-size:13px;color:#AEBBAE}
.who b{color:#fff;display:block;font-size:15px}
.main{padding:28px 32px 80px;max-width:1240px;width:100%}
.mtop{display:none}
h1{font-size:34px;line-height:1.05;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 22px}
h2{font-size:17px;font-weight:700;margin:26px 0 10px}

/* bits */
.btn{border:0;background:var(--moss);color:#fff;padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--moss2)}
.btn.ghost{background:transparent;color:var(--moss);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--paper)}
.btn.ochre{background:var(--ochre);color:#1C1A12}
.btn.danger{background:transparent;color:var(--rust);box-shadow:inset 0 0 0 1px var(--rust-soft)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--stone2);color:var(--ink);white-space:nowrap}
.chip.ochre{background:var(--ochre-soft);color:#6E4E14}
.chip.ok{background:var(--ok-soft);color:#2F4B29}
.chip.rust{background:var(--rust-soft);color:#7A2F1D}
.chip.moss{background:var(--moss);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:12px}
label.f>input,label.f>select,label.f>textarea{margin-top:4px;color:var(--ink);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.muted{color:var(--mute)}
.empty{padding:22px;text-align:center;color:var(--mute);background:var(--paper);border:1px dashed var(--line);border-radius:12px}

/* lists */
.list{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:#fff}
.row .nm{font-weight:600}
.row .meta{font-size:13px;color:var(--mute)}
.row .grow{flex:1;min-width:0}
.row .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.flag{color:var(--ochre);font-weight:800}

/* today */
.today{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.today section h2{margin-top:0;display:flex;justify-content:space-between;align-items:baseline}
.today section h2 span{font-size:13px;color:var(--mute);font-weight:500}

/* boards */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.col{min-width:236px;max-width:236px;background:var(--stone2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.col h3{margin:2px 4px 4px;font-size:14px;display:flex;justify-content:space-between}
.col h3 span{color:var(--mute);font-weight:500}
.card{background:var(--paper);border-radius:9px;padding:10px 11px;cursor:pointer;border:1px solid transparent}
.card:hover{border-color:var(--moss3)}
.card .nm{font-weight:600}
.card .meta{font-size:12px;color:var(--mute);margin-top:2px}
.card .chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}

/* toolbar */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar input{max-width:320px}
.bar select{width:auto}
.spacer{flex:1}

/* money */
.columns{background:var(--moss);color:#E9EBE4;border-radius:16px;padding:24px 26px 20px;margin-bottom:22px}
.columns .head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.columns .big{font-size:56px;font-weight:800;line-height:.9;letter-spacing:-.03em;color:#fff}
.columns .big small{font-size:16px;font-weight:500;color:#AEBBAE;letter-spacing:0;margin-left:8px}
.columns .next{font-size:14px;color:#C9D1C6;text-align:right}
.columns .next b{color:var(--ochre-soft)}
.basalt{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:190px}
.pillar{position:relative;background:#3B4A3E;border-radius:6px 6px 2px 2px;overflow:hidden;clip-path:polygon(0 8px,50% 0,100% 8px,100% 100%,0 100%)}
.pillar .fill{position:absolute;left:0;right:0;bottom:0;background:#E9EBE4;transition:height .9s cubic-bezier(.2,.7,.2,1)}
.pillar.done .fill{background:var(--ochre)}
.pillar.cur{box-shadow:inset 0 0 0 2px var(--ochre)}
.plabels{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:10px;font-size:12px;color:#AEBBAE}
.plabels b{display:block;color:#fff;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.01em}
.stat .k{font-size:13px;color:var(--mute)}
.split{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.split .track{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--stone2);margin:10px 0 8px}
.split .a{background:var(--moss)} .split .b{background:var(--ochre)}
.split .legend{display:flex;justify-content:space-between;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.funnel .fr{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.funnel .fb{height:10px;background:var(--moss3);border-radius:5px}

/* contact panel */
.scrim{position:fixed;inset:0;background:rgba(28,34,29,.42);z-index:30}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--stone);z-index:31;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(28,34,29,.18)}
.ph{background:var(--paper);padding:18px 22px 0;border-bottom:1px solid var(--line);padding-top:calc(18px + env(safe-area-inset-top,0px))}
.ph .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ph h2{font-size:28px;margin:0;font-weight:800;letter-spacing:-.02em}
.ph .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ph .ctl{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.ph .ctl select{width:auto}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;font-weight:600;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--moss);border-color:var(--moss)}
.pb{flex:1;overflow-y:auto;padding:20px 22px 40px}
.x{all:unset;cursor:pointer;font-size:24px;line-height:1;padding:4px 8px;color:var(--mute)}
.qa{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.qa .qh{display:flex;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);font-weight:700}
.qa dl{margin:0;padding:6px 16px 10px}
.qa dt{font-size:13px;color:var(--mute);margin-top:10px}
.qa dd{margin:2px 0 0;white-space:pre-wrap}
.note{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px}
.note .nt{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:4px;gap:8px}
.money3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.prog{height:8px;background:var(--stone2);border-radius:4px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--moss)}
.seg{display:flex;gap:6px;margin:4px 0 12px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--moss);color:#fff;border-color:var(--moss)}
.log{font-size:13px;border-left:2px solid var(--stone2);padding:2px 0 10px 12px}
.log b{font-weight:600}

/* modal + gate + toast */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:rgba(28,34,29,.42);padding:16px}
.mbox{background:var(--stone);border-radius:16px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px}
.mbox h2{margin:0 0 14px;font-size:22px}
.gate{min-height:100vh;display:grid;place-items:center;background:var(--moss);padding:20px}
.gbox{width:min(400px,100%);color:#E9EBE4}
.gbox .brand{font-size:44px;margin-bottom:28px}
.gbox .who{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.gbox .who button{border:1px solid #57695B;background:transparent;border-radius:10px;padding:12px;text-align:left;cursor:pointer;color:#E9EBE4}
.gbox .who button.on{background:#F7F7F3;color:var(--moss);border-color:#F7F7F3}
.gbox .who b{display:block;font-size:16px}
.gbox .who span{font-size:12px;opacity:.75}
.gbox input{background:#3B4A3E;border-color:#57695B;color:#fff;font-size:18px;letter-spacing:.2em;text-align:center;margin-bottom:10px}
.gbox .hint{font-size:12px;color:#AEBBAE;margin-top:14px}
.gbox .err{color:#F2C4B6;font-size:13px;min-height:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-size:14px}

/* mobile */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mtop{display:flex;justify-content:space-between;align-items:center;background:var(--moss);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
  .mtop .brand{font-size:17px}
  .main{padding:20px 14px 110px}
  h1{font-size:28px}
  .mnav{position:fixed;left:0;right:0;bottom:0;background:var(--moss);display:flex;overflow-x:auto;z-index:20;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .mnav button{all:unset;cursor:pointer;flex:1;min-width:72px;text-align:center;padding:8px 6px;border-radius:8px;color:#C9D1C6;font-size:12px;font-weight:600}
  .mnav button.on{background:#F7F7F3;color:var(--moss)}
  .grid2,.two{grid-template-columns:1fr}
  .basalt{height:140px;gap:6px}
  .plabels{gap:6px;font-size:10px}
  .plabels b{font-size:13px}
  .columns .big{font-size:44px}
  .today{grid-template-columns:1fr}
  .money3 .v{font-size:18px}
  .money3 .stat{padding:10px}
  .stats{grid-template-columns:1fr 1fr}
  .stat .v{font-size:21px}
}
@media (min-width:861px){.mnav{display:none}}

/* ---------- v2 additions ---------- */
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 12px}
.sync .dot{width:8px;height:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.kpi .k{font-size:12px;color:var(--mute);margin-top:2px}
.kpi.hi{background:var(--moss);border-color:var(--moss);color:#fff}
.kpi.hi .k{color:#C9D1C6}
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.dash h2:first-child{margin-top:0}
.move{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer}
.move:first-child{border-top:0}
.move:hover{background:#fff}
.move .grow{flex:1;min-width:0}
.move .nm{font-weight:700}
.move .why{font-size:13px;color:var(--ink);margin-top:1px}
.move .data{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.move .data .q{font-size:12px;color:var(--mute);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.move .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.age{font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px;background:var(--ochre);color:#1C1A12}
.evcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;cursor:pointer}
.evcard:hover{border-color:var(--moss3)}
.evcard.up{background:var(--moss);color:#E9EBE4;border-color:var(--moss)}
.evcard.up .muted{color:#AEBBAE}
.evcard .when{font-size:13px;font-weight:600;color:var(--ochre)}
.evcard.up .when{color:var(--ochre-soft)}
.evcard h3{margin:2px 0 8px;font-size:20px;font-weight:800;letter-spacing:-.01em}
.evnums{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 12px}
.evnums div{font-size:12px;color:var(--mute)}
.evcard.up .evnums div{color:#AEBBAE}
.evnums b{display:block;font-size:22px;color:var(--ink);font-weight:700}
.evcard.up .evnums b{color:#fff}
.evbtns{display:flex;gap:6px;flex-wrap:wrap}
.evcard.up .btn.ghost{color:#fff;box-shadow:inset 0 0 0 1px #57695B}
.evcard.up .btn.ghost:hover{background:var(--moss2)}
.back{all:unset;cursor:pointer;color:var(--mute);font-weight:600;font-size:14px;display:inline-block;margin-bottom:10px}
.back:hover{color:var(--moss)}
.att{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.att button{all:unset;cursor:pointer;padding:5px 10px;font-size:13px;font-weight:600;color:var(--mute);background:#fff}
.att button.yes{background:var(--ok);color:#fff}
.att button.no{background:var(--rust);color:#fff}
.box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.box h3{margin:0 0 10px;font-size:15px;font-weight:700}
.path{display:flex;align-items:flex-start;margin:4px 0 6px;overflow-x:auto;padding-bottom:4px}
.path .st{flex:1;min-width:64px;text-align:center;position:relative;font-size:11px;color:var(--mute);font-weight:600}
.path .st:before{content:"";position:absolute;top:8px;left:-50%;right:50%;height:2px;background:var(--stone2)}
.path .st:first-child:before{display:none}
.path .st.on:before{background:var(--moss)}
.path .st i{display:block;width:18px;height:18px;border-radius:50%;margin:0 auto 5px;background:var(--stone2);position:relative;z-index:1;border:3px solid var(--paper)}
.path .st.on{color:var(--ink)}
.path .st.on i{background:var(--moss)}
.path .st.now i{background:var(--ochre)}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--stone2)}
.tli{position:relative;margin-bottom:14px}
.tli:before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--moss3);border:2px solid var(--stone)}
.tli.ms:before{background:var(--ochre);width:12px;height:12px;left:-20px}
.tli.nt:before{background:var(--paper);border-color:var(--moss3)}
.tli .h{font-weight:600;font-size:14px}
.tli .d{font-size:14px;white-space:pre-wrap;margin-top:2px}
.tli .w{font-size:12px;color:var(--mute)}
.chero{background:var(--moss);color:#E9EBE4;border-radius:16px;padding:22px 24px;margin-bottom:18px}
.chero h1{color:#fff;margin:0}
.chero .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#AEBBAE;margin:6px 0 14px}
.chero .meta b{color:#fff;font-weight:600}
.chero .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chero select{width:auto;background:#3B4A3E;border-color:#57695B;color:#fff}
.chero .btn.ghost{color:#fff;box-shadow:inset 0 0 0 1px #57695B}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.vision{font-size:15px;white-space:pre-wrap}
.vision .lbl{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-top:12px;display:block}
.vision .lbl:first-child{margin-top:0}
.rate{display:grid;grid-template-columns:130px 1fr 26px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.rate .bar{height:8px;background:var(--stone2);border-radius:4px;overflow:hidden}
.rate .bar i{display:block;height:100%;background:var(--moss)}
.goal{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0}
.goal input{width:18px;height:18px;margin-top:2px;flex:none}
.goal.done span{text-decoration:line-through;color:var(--mute)}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ccard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.ccard:hover{border-color:var(--moss3)}
.ccard .nm{font-weight:700;font-size:16px}
.ccard .goalline{font-size:13px;margin:8px 0;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}

/* ---------- 2. STORAGE ----------
   Every screen goes through Store. Today: this browser. Live build: only this
   block changes, to Supabase, one row per record.                             */
const Store = (() => {
  const KEY = 'lbyd_crm_v3';
  let db = null;
  const persist = () => { try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} };
  const up = (arr, x) => { x.updated_at = Date.now(); const i = arr.findIndex(y=>y.id===x.id); if(i<0) arr.unshift(x); else arr[i]=x; persist(); };
  return {
    load(){
      try{ db = JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ db = null; }
      if(!db || !db.contacts) db = seed();
      db.tasks = db.tasks||[]; db.synced = db.synced||{}; db.prefs = db.prefs||{showTest:true};
      persist();
    },
    contacts(){ return db.contacts; }, events(){ return db.events; }, tasks(){ return db.tasks; },
    getC(id){ return db.contacts.find(c=>c.id===id); }, getE(id){ return db.events.find(e=>e.id===id); },
    putC(c){ up(db.contacts,c); }, putE(e){ up(db.events,e); }, putT(t){ up(db.tasks,t); },
    isSynced(id){ return !!db.synced[id]; }, markSynced(id){ db.synced[id]=1; },
    get lastSync(){ return db.lastSync||null; }, set lastSync(v){ db.lastSync=v; persist(); },
    get prefs(){ return db.prefs; }, savePrefs(){ persist(); }, flush(){ persist(); },
    reset(){ const s = seed(), realC = db.contacts.filter(c=>!c.demo), realE = db.events.filter(e=>!e.demo);
             db.contacts = [...realC, ...s.contacts]; db.events = [...realE, ...s.events.filter(e=>e.demo || !realE.some(r=>r.id===e.id))]; persist(); },
    dump(){ return db; }
  };
})();

/* ---------- 4. HELPERS ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Math.round(Number(n)||0).toLocaleString('en-US');
const fmtDate = ms => ms ? new Date(ms).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
const fmtWhen = ms => ms ? new Date(ms).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '';
const evMs = e => e && e.date ? new Date(e.date).getTime() : 0;
const evWhen = e => e ? new Date(e.date).toLocaleString('en-US',{weekday:'long',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '';
const todayStr = () => localISO(Date.now()).slice(0,10);
const startToday = () => { const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const monthStart = () => { const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); return d.getTime(); };
const weekAgo = () => Date.now()-7*DAY;
const daysSince = ms => Math.floor((Date.now()-ms)/DAY);
const ago = ms => { if(!ms) return 'never'; const m = Math.floor((Date.now()-ms)/60000);
  if(m<1) return 'just now'; if(m<60) return m+'m ago'; const h=Math.floor(m/60); if(h<24) return h+'h ago';
  const d=Math.floor(h/24); return d===1?'yesterday':d+' days ago'; };
const until = ms => { const d = ms - Date.now(); if(d<0) return 'happening now'; const h=Math.floor(d/HOUR); if(h<24) return 'in '+h+'h'; const dd=Math.ceil(d/DAY); return 'in '+dd+' day'+(dd>1?'s':''); };
const first = n => String(n||'').trim().split(/\s+/)[0] || 'there';
const stage = id => SALES_STAGES.find(s=>s.id===id) || SALES_STAGES[0];
const sIdx = id => id==='lost' ? -1 : SALES_STAGES.findIndex(s=>s.id===id);
const csStage = id => CS_STAGES.find(s=>s.id===id);
const csIdx = id => CS_STAGES.findIndex(s=>s.id===id);
const who = () => S.role ? ROLES[S.role].label : 'Form';
const lastActivity = c => Math.max(c.updated_at||0, (c.log[0]||{}).at||0, c.last_contacted||0);
const showTest = () => Store.prefs.showTest !== false;
const visible = c => !c.archived && (showTest() || !c.demo);
const live = () => Store.contacts().filter(visible);
const liveEvents = () => Store.events().filter(e => showTest() || !e.demo);
const normPhone = v => String(v||'').replace(/\D/g,'');
const normIG = v => String(v||'').trim().toLowerCase().replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/[\/\s]/g,'');
const normEmail = v => String(v||'').trim().toLowerCase();
const evType = e => EVENT_TYPES[e && e.type] || EVENT_TYPES.hangout;

// Membership
const isMember = c => !!(c.membership && c.membership.status==='active');
const members = () => live().filter(isMember);
const tierOf = c => c.membership ? c.membership.tier : null;
const courseWeek = c => c.membership ? Math.min(COURSE_WEEKS, Math.max(1, Math.floor((Date.now()-c.membership.start)/(7*DAY))+1)) : 0;
const paidThisMonth = c => c.payments.some(p=>p.at>=monthStart());
const totalPaid = c => c.payments.reduce((a,p)=>a+(Number(p.amount)||0),0);
const mrr = () => members().reduce((a,c)=>a+(Number(c.membership.price)||0),0);

function findMatch(f, exceptId){
  const e = normEmail(f.email), p = normPhone(f.whatsapp), i = normIG(f.instagram);
  return Store.contacts().find(c => c.id!==exceptId && ((e && normEmail(c.email)===e) || (p.length>=8 && normPhone(c.whatsapp)===p) || (i && normIG(c.instagram)===i)));
}
function latestKey(c,k){ for(const s of [...c.submissions].sort((a,b)=>b.at-a.at)) if(s.key && s.key[k]) return s.key[k]; return ''; }
function answer(c, type, re){
  for(const s of [...c.submissions].filter(x=>!type||x.type===type).sort((a,b)=>b.at-a.at)){ const hit = s.answers.find(([q])=>re.test(q)); if(hit && hit[1]) return hit[1]; }
  return '';
}
const hasSub = (c,t) => c.submissions.some(s=>s.type===t);
const qualified = c => latestKey(c,'ready')==='Yes';

// Events and attendance
const upcoming = () => liveEvents().filter(e=>evMs(e) > Date.now()-3*HOUR).sort((a,b)=>evMs(a)-evMs(b));
const nextEvent = type => upcoming().find(e=>!type || e.type===type);
const recOf = (c, eid) => c.events.find(x=>x.id===eid);
const eventPeople = e => live().filter(c=>recOf(c,e.id));
function contactNextEvent(c){ const ids = c.events.map(x=>x.id); return upcoming().find(e=>ids.includes(e.id)); }
function contactLastEvent(c){ const ids = c.events.map(x=>x.id); return liveEvents().filter(e=>ids.includes(e.id) && evMs(e)<=Date.now()).sort((a,b)=>evMs(b)-evMs(a))[0]; }
function evStats(e){
  const p = eventPeople(e), r = c => recOf(c,e.id);
  const joined = p.filter(c=>isMember(c) && c.membership.start >= evMs(e) - DAY);
  return {inv:p.length, rsvp:p.filter(c=>r(c).rsvp_at).length, showed:p.filter(c=>r(c).showed===true).length,
          part:p.filter(c=>r(c).participated).length, joined:joined.length, mrr:joined.reduce((a,c)=>a+Number(c.membership.price||0),0)};
}

// Form standing: not sent, sent, submitted
function formState(c, type){
  if(type==='event'){ if(c.events.some(x=>x.rsvp_at)) return 'done'; return c.events.length ? 'sent' : ''; }
  if(hasSub(c,type)) return 'done';
  return c.form_sent && c.form_sent[type] ? 'sent' : '';
}
function formChips(c){
  const lab = {event:'Event', application:'Application', onboarding:'Onboarding'};
  return `<span class="fchips">${['event','application','onboarding'].map(t=>{ const s = formState(c,t);
    return `<span class="fchip ${s}" title="${s==='done'?'Submitted':s==='sent'?'Sent, not submitted':'Not sent'}">${lab[t]}: ${s==='done'?'In':s==='sent'?'Sent':'Not sent'}</span>`; }).join('')}</span>`;
}

function formLink(type, c, ev){
  const base = type==='event' ? ((ev && (ev.form_url||ev.wa_link)) || '') : FORMS[type];
  if(!base) return '';
  if(type==='event' && !ev.form_url) return base;   // WhatsApp group link, no form
  const parts = String(c.name||'').trim().split(/\s+/), q = new URLSearchParams();
  if(type!=='event'){ q.set('crm_id', c.id); q.set('source','crm'); }
  if(c.email) q.set('email', c.email);
  if(parts[0]) q.set('full_name[first]', parts[0]);
  if(parts.length>1) q.set('full_name[last]', parts.slice(1).join(' '));
  return base + '?' + q.toString();
}
function fillMsg(key, c, ev){
  ev = ev || contactNextEvent(c) || contactLastEvent(c) || nextEvent('hangout') || nextEvent();
  const linkType = {invite_hangout:'event',invite_inperson:'event',invite_workshop:'event',application:'application',onboarding:'onboarding',wb_chase:'onboarding'}[key];
  return MSG[key].text
    .replace('[FIRST]', first(c.name)).replace('[ME]', who())
    .replace('[LINK]', linkType ? formLink(linkType, c, ev) : '')
    .replace('[EVENT]', ev ? evType(ev).label : 'the session').replace('[EVENT_DATE]', ev ? evWhen(ev) : 'soon')
    .replace('[GROUP]', ev && ev.wa_link ? 'Group chat: '+ev.wa_link : '')
    .replace('[CAL]', CAL_LINK ? 'Grab a time here: '+CAL_LINK : 'What times work for you this week?')
    .replace('[CALL_WHEN]', c.call&&c.call.at ? fmtWhen(c.call.at) : 'soon')
    .replace('[MEET]', c.call&&c.call.meet ? c.call.meet : '').trim();
}
const waUrl = (phone, text) => 'https://wa.me/' + normPhone(phone) + (text ? '?text=' + encodeURIComponent(text) : '');
function toast(m){ const t=$('#toast'); t.innerHTML='<div class="toast">'+esc(m)+'</div>'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.innerHTML='',2600); }
async function copy(text){ if(!text){ toast('No link set for this yet'); return; } try{ await navigator.clipboard.writeText(text); toast('Link copied'); }catch(e){ prompt('Copy this link:', text); } }

/* ---------- 5. SYNC ---------- */
const SYNC = {state:'idle', msg:''};
function syncFormIds(){ return [...new Set([formId(FORMS.application), formId(FORMS.onboarding), ...Store.events().filter(e=>!e.demo).map(e=>e.form_id)].filter(Boolean))]; }
async function syncAll(manual){
  if(location.protocol==='file:'){ SYNC.state='off'; SYNC.msg='Sync starts once the site is on Netlify'; if(manual) toast(SYNC.msg); paintSync(); return; }
  SYNC.state='busy'; paintSync();
  try{
    const r = await fetch('/.netlify/functions/jotform-sync?forms='+syncFormIds().join(','), {headers:{'x-crm-pin':ROLES[S.role].pin}, cache:'no-store'});
    const j = await r.json().catch(()=>({error:'The sync function did not answer. Check it deployed.'}));
    if(!r.ok || !j.ok) throw new Error(j.error || 'Sync failed ('+r.status+')');
    let added=0, updated=0;
    for(const sub of j.submissions.sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)))){
      if(Store.isSynced(sub.id)) continue;
      const res = mergeSubmission(sub); Store.markSynced(sub.id);
      if(res==='new') added++; else if(res==='updated') updated++;
    }
    const cal = await syncCal();
    Store.lastSync = Date.now(); Store.flush();
    const warns = [...(j.errors||[]).map(e=>'Form '+e.form+': '+e.error), ...(cal.error?['Cal.com: '+cal.error]:[])];
    SYNC.state = warns.length ? 'warn' : 'ok'; SYNC.msg = warns.join(' · ');
    render();
    const parts = [];
    if(added||updated) parts.push(added+' new, '+updated+' updated from forms');
    if(cal.changed) parts.push(cal.changed+' call'+(cal.changed>1?'s':'')+' from Cal.com');
    if(parts.length) toast(parts.join(' · ')); else if(manual) toast(warns.length ? warns[0] : 'Everything is up to date');
  }catch(e){ SYNC.state='err'; SYNC.msg=e.message; paintSync(); if(manual) toast(e.message); }
}
async function syncCal(){
  try{
    const r = await fetch('/.netlify/functions/cal-sync', {headers:{'x-crm-pin':ROLES[S.role].pin}, cache:'no-store'});
    const j = await r.json().catch(()=>({}));
    if(r.status===404 || j.notConfigured) return {changed:0};
    if(!r.ok || !j.ok) return {changed:0, error:j.error||('HTTP '+r.status)};
    let changed = 0; const byPerson = new Map();
    for(const b of j.bookings){
      const a = b.attendees[0] || {};
      let c = findMatch({email:a.email, whatsapp:a.phone});
      if(!c && j.filtered && b.status!=='cancelled'){
        c = blankContact({name:a.name||'New booking', email:a.email||'', whatsapp:a.phone||'', source:'Instagram / social', from_form:true, log:[{at:Date.now(), by:'Cal.com', body:'Booked a call through Cal.com'}]});
        Store.putC(c);
      }
      if(!c) continue;
      if(!byPerson.has(c.id)) byPerson.set(c.id, {c, list:[]});
      byPerson.get(c.id).list.push(b);
    }
    for(const {c, list} of byPerson.values()){
      const liveB = list.filter(b=>!['cancelled','rejected'].includes(b.status)).sort((x,y)=>Date.parse(y.start)-Date.parse(x.start));
      const b = liveB[0] || list.sort((x,y)=>Date.parse(y.start)-Date.parse(x.start))[0];
      const at = Date.parse(b.start), cancelled = !liveB.length, prev = c.call || {};
      if(prev.uid===b.uid && prev.at===at && (prev.outcome==='cancelled')===cancelled) continue;
      const keep = prev.uid===b.uid && !cancelled && prev.outcome && prev.outcome!=='cancelled';
      c.call = {uid:b.uid, at, meet:b.meetingUrl||prev.meet||'', outcome: cancelled?'cancelled':keep?prev.outcome:'booked', via:'cal'};
      if(!cancelled && sIdx(c.sales_stage) < sIdx('call') && c.sales_stage!=='lost') c.sales_stage='call';
      c.log.unshift({at:Date.now(), by:'Cal.com', body: cancelled?'Call cancelled on Cal.com': prev.uid&&prev.uid!==b.uid ? 'Call rescheduled to '+fmtWhen(at) : 'Call booked for '+fmtWhen(at)});
      Store.putC(c); changed++;
    }
    return {changed};
  }catch(e){ return {changed:0, error:e.message}; }
}
function pickAns(sub, test){ const a = sub.answers.find(test); return a ? a.a : ''; }
function mergeSubmission(sub){
  if(Store.contacts().some(c=>c.submissions.some(s=>s.sub_id===sub.id))) return null;
  const fid = String(sub.form_id), at = Date.parse(String(sub.created_at).replace(' ','T')) || Date.now();
  let type = fid===formId(FORMS.application) ? 'application' : fid===formId(FORMS.onboarding) ? 'onboarding' : null, ev = null;
  if(!type){
    const evs = Store.events().filter(e=>!e.demo && e.form_id===fid);
    if(!evs.length) return null;
    const tag = pickAns(sub, a=>/^event$/i.test(a.q) || a.n==='event');
    ev = (tag && evs.find(e=>e.tag===tag || String(e.date).startsWith(tag))) || evs.filter(e=>evMs(e) >= at - 6*HOUR).sort((a,b)=>evMs(a)-evMs(b))[0] || evs.sort((a,b)=>evMs(b)-evMs(a))[0];
    type = 'event';
  }
  const f = {
    crm:pickAns(sub,a=>/^crm_?id$/i.test(a.n)||/^crm id$/i.test(a.q)), name:pickAns(sub,a=>a.t==='control_fullname'||a.n==='full_name'||/^(full )?name$/i.test(a.q)),
    email:pickAns(sub,a=>a.t==='control_email'||/e-?mail/i.test(a.n+' '+a.q)), phone:pickAns(sub,a=>a.t==='control_phone'||/whatsapp|phone/i.test(a.n+' '+a.q)),
    ig:pickAns(sub,a=>/instagram/i.test(a.n+' '+a.q)), budget:pickAns(sub,a=>/how much are you able/i.test(a.q)),
    ready:pickAns(sub,a=>/position to invest/i.test(a.q)), commit:pickAns(sub,a=>/how committed/i.test(a.q))
  };
  let c = (f.crm && Store.getC(f.crm)) || findMatch({email:f.email, whatsapp:f.phone, instagram:f.ig}), res = 'updated';
  if(!c){ c = blankContact({name:f.name||'New sign-up', email:f.email, whatsapp:f.phone, instagram:normIG(f.ig), source:'Instagram / social', from_form:true, created_at:at, log:[]}); res = 'new'; }
  else { if(!c.email&&f.email) c.email=f.email; if(!c.whatsapp&&f.phone) c.whatsapp=f.phone; if(!c.instagram&&f.ig) c.instagram=normIG(f.ig); if((!c.name||c.name==='New sign-up')&&f.name) c.name=f.name; }
  c.submissions.push({type, at, sub_id:sub.id, form_id:fid, event_id:ev?ev.id:null, key:{budget:f.budget, ready:f.ready, commitment:f.commit},
    answers: sub.answers.filter(a=>a.a && !/^(crm id|source|event)$/i.test(a.q) && !/^crm_?id$/i.test(a.n)).map(a=>[a.q, a.a])});
  c.log.unshift({at, by:'Form', body: type==='event' ? 'Signed up (RSVP) for '+(ev?ev.name:'an event') : type==='application' ? 'Submitted the application' : 'Submitted the onboarding workbook'});
  if(type==='event' && ev){
    let x = recOf(c, ev.id); if(!x){ x = {id:ev.id, invited_at:at, rsvp_at:null, showed:null, participated:false}; c.events.push(x); }
    x.rsvp_at = x.rsvp_at || at;
    if(sIdx(c.sales_stage) < sIdx('invited') && c.sales_stage!=='lost') c.sales_stage='invited';
  }
  if(type==='application' && sIdx(c.sales_stage) < sIdx('applied') && c.sales_stage!=='lost') c.sales_stage='applied';
  if(type==='onboarding' && (!c.cs_stage || c.cs_stage==='onb_sent')) c.cs_stage='workbook';
  Store.putC(c); return res;
}

/* ---------- 6. ACTIONS ---------- */
function logTo(c, body){ c.log.unshift({at:Date.now(), by:who(), body}); }
function save(c, msg){ Store.putC(c); if(msg) toast(msg); }
function bump(c, id){ if(c.sales_stage!=='lost' && sIdx(c.sales_stage) < sIdx(id)) c.sales_stage = id; }
function setStage(c, id){ if(c.sales_stage===id) return; logTo(c,'Stage: '+stage(c.sales_stage).label+' to '+stage(id).label); c.sales_stage=id; save(c,'Moved to '+stage(id).label); }
function setCS(c, id){ logTo(c,'Client stage: '+((csStage(c.cs_stage)||{}).label||'Not sent')+' to '+csStage(id).label); c.cs_stage=id; save(c,'Moved to '+csStage(id).label); }
function sendWA(c, key, ev){
  const text = key==='plain' ? '' : fillMsg(key, c, ev);
  if(['application','onboarding','wb_chase'].includes(key) && !text.includes('http')){ toast('No form link set for this yet.'); return; }
  window.open(waUrl(c.whatsapp, text), '_blank', 'noopener');
  c.last_contacted = Date.now();
  if(['application','onboarding'].includes(key)){ c.form_sent[key] = Date.now(); }
  if(key==='onboarding' && !c.cs_stage){ c.cs_stage='onb_sent'; c.onb_sent_at=Date.now(); }
  logTo(c, 'WhatsApp: '+MSG[key].label+(ev?' ('+ev.name+')':''));
  save(c, MSG[key].label+' opened in WhatsApp');
}
function inviteTo(c, ev, send){
  if(!recOf(c, ev.id)) c.events.push({id:ev.id, invited_at:Date.now(), rsvp_at:null, showed:null, participated:false});
  bump(c,'invited');
  if(send) sendWA(c, evType(ev).invite, ev); else { logTo(c,'Invited to '+ev.name); save(c,'Invited'); }
}
function setStep(c, eid, step){
  const x = recOf(c, eid); if(!x) return; const ev = Store.getE(eid), nm = ev ? ev.name : 'event';
  if(step==='rsvp'){ x.rsvp_at = x.rsvp_at ? null : Date.now(); logTo(c, x.rsvp_at?'RSVP\'d to '+nm:'RSVP cleared: '+nm); }
  if(step==='showed'){ x.showed = x.showed===true ? null : true; if(x.showed){ x.rsvp_at = x.rsvp_at||Date.now(); bump(c,'showed'); } else x.participated=false; logTo(c, x.showed?'Showed up: '+nm:'Attendance cleared: '+nm); }
  if(step==='missed'){ x.showed = x.showed===false ? null : false; if(x.showed===false) x.participated=false; logTo(c, x.showed===false?'Missed: '+nm:'Attendance cleared: '+nm); }
  if(step==='part'){ x.participated = !x.participated; if(x.participated){ x.showed=true; bump(c,'engaged'); } logTo(c, x.participated?'Participated: '+nm:'Participation cleared: '+nm); }
  save(c);
}
function startMembership(c, tier, price, course, start){
  c.membership = {tier, price:Number(price)||TIERS_PLAN[tier].price, start:start?new Date(start+'T12:00').getTime():Date.now(), course, status:'active', cancelled_at:null};
  c.sales_stage = tier; if(c.call && c.call.outcome!=='cancelled') c.call.outcome='closed';
  logTo(c, 'Joined: '+TIERS_PLAN[tier].label+', '+money(c.membership.price)+'/month'); save(c, 'Welcome in. Log their first payment and send onboarding.');
}
function upgrade(c, price){
  c.membership.tier='premium'; c.membership.price=Number(price)||c.membership.price; c.membership.upgraded_at=Date.now(); c.sales_stage='premium';
  logTo(c, 'Upgraded to Premium, '+money(c.membership.price)+'/month'); save(c,'Upgraded to Premium');
}
function cancelMembership(c){ c.membership.status='cancelled'; c.membership.cancelled_at=Date.now(); logTo(c,'Cancelled membership'); save(c,'Membership cancelled'); }
function restartMembership(c){ c.membership.status='active'; c.membership.cancelled_at=null; c.sales_stage=c.membership.tier; logTo(c,'Membership restarted'); save(c,'Membership restarted'); }
function logPayment(c, amount, date, method){
  const at = date ? new Date(date+'T12:00:00').getTime() : Date.now();
  c.payments.unshift({id:rid('p'), at, amount:Number(amount), method}); logTo(c,'Payment logged: '+money(amount)+' ('+method+')'); save(c,'Payment logged');
}
function addNote(c, body, tag){ c.notes.unshift({id:rid('n'), at:Date.now(), by:who(), tag, body}); if(tag==='checkin') c.last_contacted=Date.now(); save(c, tag==='checkin'?'Check-in logged':'Note added'); }

/* ---------- 7. NEXT MOVES ---------- */
function nextMove(c){
  const st = c.sales_stage, now = Date.now();
  if(isMember(c) || ['base','premium','lost'].includes(st)) return null;
  const call = c.call || {}, nev = contactNextEvent(c), nrec = nev && recOf(c, nev.id), lev = contactLastEvent(c), lrec = lev && recOf(c, lev.id);
  const fresh = c.from_form && !c.last_contacted && !call.at;
  if(fresh) return {prio:0, tpl:'welcome', why:'New sign-up from a form. Say hi and start the conversation.', fresh:true};
  if(call.at && call.outcome!=='cancelled' && call.at>now && call.at-now<26*HOUR) return {prio:1, tpl:'call_remind', why:'Call '+fmtWhen(call.at)+'. Send the reminder.'};
  if(['no_show','cancelled'].includes(call.outcome)) return {prio:2, tpl:'rebook', why:(call.outcome==='cancelled'?'Cancelled':'Missed')+' their call. Rebook it.'};
  if(st==='applied' && !call.at) return qualified(c) ? {prio:2, tpl:'book_call', why:'Applied and ready to invest. Book the call.'} : {prio:3, tpl:null, review:true, why:'Application to review: '+(latestKey(c,'ready')||'no answer')+'.'};
  if(['showed','not_closed'].includes(call.outcome)) return {prio:3, tpl:'not_closed', why:'Had the call, not joined yet. Follow up.'};
  if(nev && nrec && nrec.rsvp_at && evMs(nev)-now < 36*HOUR) return {prio:3, tpl:'remind', ev:nev, why:"RSVP'd to "+nev.name+' '+until(evMs(nev))+'. Send a reminder.'};
  if(lev && lrec && lrec.showed && (c.last_contacted||0) < evMs(lev) && daysSince(evMs(lev))<=5) return {prio:3, tpl:'after', ev:lev, why:'Came to '+lev.name+'. Follow up while it\'s fresh.'};
  if(st==='engaged' && !hasSub(c,'application') && !c.form_sent.application) return {prio:4, tpl:'application', why:'Engaged at events. Send the application.'};
  if(nev && nrec && !nrec.rsvp_at && daysSince(nrec.invited_at)>=2) return {prio:4, tpl:'nudge', ev:nev, why:'Invited to '+nev.name+' '+ago(nrec.invited_at)+', no RSVP.'};
  if(c.next_date && c.next_date <= todayStr()) return {prio:5, tpl:'plain', why:(c.next_action||'Follow-up due')+(c.next_date<todayStr()?' (overdue)':'')};
  if(!nev && ['lead','invited','showed','engaged'].includes(st)){
    const h = nextEvent('hangout'), e = h || nextEvent('workshop');
    return e ? {prio:6, tpl:evType(e).invite, ev:e, invite:true, why:'Not invited to anything coming up. Invite to '+e.name+' ('+evWhen(e)+').'}
             : {prio:6, tpl:null, why:'Invite to the next hangout. Add it on the Events page first.'};
  }
  return null;
}

function weekCounts(){

  conn.sort((a,b)=>b.at-a.at);
  const act = []; const KEY = /^(Joined|Upgraded|Cancelled membership|Submitted|Signed up|Showed up|Participated|Call booked|Call rescheduled|Goal done)/;

    <div class="kpis">${kpi(mem.length,'Active members',true)}${kpi(money(mrr()),'Monthly recurring')}${kpi(w.newMembers,'New members this week')}${kpi(w.leads,'New leads this week')}${kpi(w.invites,'Invites sent')}${kpi(w.showed,'Showed up to events')}</div>
    <div class="dash"><div>
      ${box('Recent client connections', conn.length?`<div class="list feed" style="background:#fff">${conn.slice(0,12).map(x=>feedItem(x.c,x.h,x.d,x.at)).join('')}</div>`:empty('No check-ins or notes on members in the last three weeks.'))}
      ${box('This week across the business', act.length?`<div class="list feed" style="background:#fff">${act.slice(0,15).map(x=>feedItem(x.c,x.h,'',x.at)).join('')}</div>`:empty('Quiet week so far.'))}
    </div><div>
      ${box('Coming up', (soon.length||calls.length||onb.length)?`<div class="list feed" style="background:#fff">
        ${soon.map(e=>{const s=evStats(e);return `<div class="fi" data-act="event" data-v="${e.id}"><div class="h"><b>${esc(e.name)}</b><span>${esc(until(evMs(e)))}</span></div><div class="d">${esc(evWhen(e))} · ${s.rsvp} RSVP'd of ${s.inv} invited</div></div>`;}).join('')}
        ${calls.map(c=>`<div class="fi" data-act="open" data-v="${c.id}"><div class="h"><b>Call: ${esc(c.name)}</b><span>${esc(until(c.call.at))}</span></div><div class="d">${esc(fmtWhen(c.call.at))}</div></div>`).join('')}
        ${onb.map(c=>`<div class="fi" data-act="client" data-v="${c.id}"><div class="h"><b>Onboarding call: ${esc(c.name)}</b><span>to book</span></div><div class="d">Workbook is in, ready to read.</div></div>`).join('')}
        </div>`:empty('Nothing in the next week.'))}
      ${box('Worth knowing', `${quiet.length?`<p class="muted" style="margin:0 0 6px;font-size:13px">Gone quiet or at risk</p><div class="list feed" style="background:#fff;margin-bottom:12px">${quiet.map(c=>`<div class="fi" data-act="client" data-v="${c.id}"><div class="h"><b>${esc(c.name)}</b><span>${c.cs_stage==='at_risk'?'at risk':'quiet'}</span></div><div class="d">Last contact ${esc(ago(c.last_contacted))}</div></div>`).join('')}</div>`:''}

      <div class="plabels">${TIERS.map(t=>`<div><b>${t.n.toLocaleString()}</b>${esc(t.name)}</div>`).join('')}</div></div>
    <div class="stats">

      <div class="stat"><div class="v">${money(cashMonth)}</div><div class="k">Cash collected this month</div></div>
      <div class="stat"><div class="v">${money(cashAll)}</div><div class="k">Cash collected all time</div></div>
      <div class="stat"><div class="v">${joinedM}</div><div class="k">New members this month</div></div>
      <div class="stat"><div class="v">${upM}</div><div class="k">Upgrades this month</div></div>
      <div class="stat"><div class="v">${cancM}</div><div class="k">Cancellations this month</div></div></div>
    <h2>Members by tier</h2>
    <div class="split"><div class="track">${n?`<div class="a" style="width:${pct(base,n)}%"></div><div class="b" style="width:${pct(prem,n)}%"></div>`:''}</div>
      <div class="legend"><span><span class="dot" style="background:var(--moss)"></span> Base · ${base} · ${money(base?mem.filter(c=>c.membership.tier==='base').reduce((a,c)=>a+c.membership.price,0):0)}/mo</span><span><span class="dot" style="background:var(--ochre)"></span> Premium · ${prem} · ${money(mem.filter(c=>c.membership.tier==='premium').reduce((a,c)=>a+c.membership.price,0))}/mo</span></div></div>
    <div class="two" style="margin-top:12px">
      <div class="split funnel"><b>Funnel</b><div style="margin-top:8px">${order.map(id=>{const k=reached(id);return `<div class="fr"><span>${esc(id==='base'?'Member':stage(id).label)}</span><div class="fb" style="width:${Math.max(2,k/top*100)}%"></div><span class="muted">${k}</span></div>`;}).join('')}</div></div>
      <div class="split"><b>No payment logged this month</b>${unpaid.length?`<div class="list" style="margin-top:10px">${unpaid.map(c=>contactRow(c, TIERS_PLAN[c.membership.tier].label+' · '+money(c.membership.price)+'/month','', 'client')).join('')}</div>`:'<p class="muted">Everyone is logged for this month.</p>'}</div></div>

/* ---------- 9. RECORDS ---------- */
function journeyPath(c){
  const si = sIdx(c.sales_stage), ci = csIdx(c.cs_stage);
  const steps = [['Invited', c.events.length>0||si>=sIdx('invited')], ['Showed up', c.events.some(x=>x.showed)||si>=sIdx('showed')],
    ['Engaged', c.events.some(x=>x.participated)||si>=sIdx('engaged')], ['Applied', hasSub(c,'application')||si>=sIdx('applied')],
    ['Member', !!c.membership], ['Workbook', hasSub(c,'onboarding')||ci>=csIdx('workbook')], ['Onboarded', ci>=csIdx('onb_call')], ['Active', ['active','completed'].includes(c.cs_stage)]];
  const last = steps.map(s=>s[1]).lastIndexOf(true);
  return `<div class="path">${steps.map(([l,on],i)=>`<div class="st ${on?'on':''} ${i===last?'now':''}"><i></i>${l}</div>`).join('')}</div>`;
}
function timeline(c){
  const it = [{at:c.created_at, ms:true, h:'First contact · '+c.source, d:c.origin_note}];
  c.events.forEach(x=>{ const e = Store.getE(x.id); if(!e) return;
    it.push({at:x.invited_at, h:'Invited: '+e.name});
    if(x.rsvp_at) it.push({at:x.rsvp_at, h:"RSVP'd: "+e.name});
    if(x.showed!==null) it.push({at:evMs(e), ms:x.showed, h:(x.showed?(x.participated?'Showed up and participated: ':'Showed up: '):'Missed: ')+e.name}); });
  c.submissions.filter(s=>s.type!=='event').forEach(s=>it.push({at:s.at, ms:true, h:s.type==='application'?'Applied':'Onboarding workbook in'}));
  if(c.call&&c.call.at) it.push({at:c.call.at, ms:true, h:'Call', d:(CALL_OUTCOMES.find(o=>o.id===c.call.outcome)||{label:'Booked'}).label});
  if(c.membership){ it.push({at:c.membership.start, ms:true, h:'Joined: '+TIERS_PLAN[c.membership.tier==='premium'&&c.membership.upgraded_at?'base':c.membership.tier].label});
    if(c.membership.upgraded_at) it.push({at:c.membership.upgraded_at, ms:true, h:'Upgraded to Premium'});
    if(c.membership.cancelled_at) it.push({at:c.membership.cancelled_at, ms:true, h:'Cancelled membership'}); }
  if(c.onb_sent_at) it.push({at:c.onb_sent_at, h:'Onboarding workbook sent'});
  c.payments.forEach(p=>it.push({at:p.at, h:'Payment '+money(p.amount), d:p.method}));
  c.notes.forEach(n=>it.push({at:n.at, nt:true, h:TAGS[n.tag]+' · '+n.by, d:n.body}));
  c.log.filter(l=>/^WhatsApp:/.test(l.body)).forEach(l=>it.push({at:l.at, h:l.body.replace('WhatsApp: ','WhatsApp sent: '), d:'by '+l.by}));
  it.sort((a,b)=>b.at-a.at);
  return `<div class="tl">${it.map(x=>`<div class="tli ${x.ms?'ms':''} ${x.nt?'nt':''}"><div class="h">${esc(x.h)}</div>${x.d?`<div class="d">${esc(x.d)}</div>`:''}<div class="w">${esc(fmtWhen(x.at))}</div></div>`).join('')}</div>`;
}
function snapshot(c){
  const rows = [['Struggling with', answer(c,'application',/struggling/i)], ['A win in 12 months', answer(c,'application',/12 months/i)],
    ['Why they applied', answer(c,'application',/made you want to apply/i)], ['Works in', answer(c,'application',/work or business/i)],
    ['Wants to change', answer(c,null,/area/i)]].filter(r=>r[1]);
  return rows.length ? `<dl class="snap">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : '';
}
function eventSteps(c, x){
  return `<span class="steps"><button class="on" title="Invited ${esc(ago(x.invited_at))}">Invited</button>
    <button class="${x.rsvp_at?'on':''}" data-act="step" data-v="${c.id}" data-e="${x.id}" data-s="rsvp">RSVP</button>
    <button class="${x.showed===true?'on':''}" data-act="step" data-v="${c.id}" data-e="${x.id}" data-s="showed">Showed</button>
    <button class="${x.participated?'on':''}" data-act="step" data-v="${c.id}" data-e="${x.id}" data-s="part">Participated</button>
    <button class="${x.showed===false?'no':''}" data-act="step" data-v="${c.id}" data-e="${x.id}" data-s="missed">Missed</button></span>`;
}

    <div class="bar"><select id="ntag" style="width:auto">${Object.entries(TAGS).map(([k,l])=>`<option value="${k}" ${k===def?'selected':''}>${esc(l)}</option>`).join('')}</select><button class="btn" data-act="addnote" ${cid?`data-cid="${cid}"`:''}>Add note</button></div>`;
}
function panelNotes(c){ return noteComposer('note') + (c.notes.map(n=>`<div class="note"><div class="nt"><span>${n.tag!=='note'?`<span class="chip">${esc(TAGS[n.tag])}</span> `:''}${esc(n.by)}</span><span>${esc(fmtDate(n.at))}</span></div>${esc(n.body)}</div>`).join('')||'<p class="muted">No notes yet.</p>'); }

    return `${m?`<div class="snap"><b>Cancelled ${esc(fmtDate(m.cancelled_at))}.</b> Was ${esc(TIERS_PLAN[m.tier].label)} at ${money(m.price)}/month. <button class="btn sm" data-act="restart">Restart membership</button></div>`:''}
      <p class="muted">${m?'Or start a new membership:':'When they join, start their membership here. This counts them as a member and starts their 12 weeks.'}</p>
      <div class="seg">${Object.entries(TIERS_PLAN).map(([k,p])=>`<button class="${t===k?'on':''}" data-act="mtier" data-v="${k}">${p.label}${p.price?' · '+money(p.price)+'/mo':''}</button>`).join('')}</div>
      <p class="muted" style="margin-top:-4px;font-size:13px">${esc(TIERS_PLAN[t].includes)}</p>
      <div class="grid2"><label class="f">Price per month<input id="mprice" type="number" value="${price||''}" placeholder="${price?'':'Set the Premium price'}"></label>

      <div class="stat"><div class="v">${money(totalPaid(c))}</div><div class="k">Paid since ${esc(fmtDate(m.start))}</div></div></div>
    <div class="prog"><i style="width:${wk/COURSE_WEEKS*100}%"></i></div>
    <p class="muted" style="margin-top:-6px">${paidThisMonth(c)?'Payment logged this month.':'No payment logged this month yet.'}</p>

    <button class="btn" data-act="logpay">Log payment</button>

    <div class="bar">${m.tier==='base'?`<input id="upprice" type="number" placeholder="Premium price / month" style="max-width:200px" value="${TIERS_PLAN.premium.price||''}"><button class="btn sm ochre" data-act="upgrade">Upgrade to Premium</button>`:''}
      <button class="btn sm danger" data-act="cancelmem">Cancel membership</button></div>
    <h2>Payments</h2>${c.payments.length?`<div class="list">${c.payments.map(x=>`<div class="row" style="cursor:default"><div class="grow"><div class="nm">${money(x.amount)}</div><div class="meta">${esc(fmtDate(x.at))} · ${esc(x.method)}</div></div></div>`).join('')}</div>`:'<p class="muted">No payments logged yet.</p>'}`;

function panelActivity(c){ return c.log.map(l=>`<div class="log"><b>${esc(l.body)}</b><div class="muted">${esc(l.by)} · ${esc(fmtWhen(l.at))}</div></div>`).join('') || '<p class="muted">No activity yet.</p>'; }

// ---- Client profile ----
function ratings(c){
  const raw = answer(c,'onboarding',/rate each area/i); if(!raw) return '';
  const pairs = [...raw.matchAll(/([A-Za-z][A-Za-z ,&]*?)\s*[:\-]?\s*(\d{1,2})(?!\d)/g)].map(m=>[m[1].replace(/^[,\s]+|[,\s]+$/g,''), Math.min(10,Number(m[2]))]).filter(p=>p[0]);
  if(!pairs.length) return `<div class="box"><h3>Life ratings</h3><p style="margin:0">${esc(raw)}</p></div>`;
  return `<div class="box"><h3>Life ratings (from the workbook)</h3>${pairs.map(([k,v])=>`<div class="rate"><span>${esc(k)}</span><div class="bar"><i style="width:${v*10}%"></i></div><b>${v}</b></div>`).join('')}</div>`;
}

        ${!ro&&c.whatsapp?`<button class="btn sm ochre" data-act="wa" data-v="${c.id}" data-t="checkin">WhatsApp check-in</button>`:''}

        <button class="btn sm ghost" data-act="open" data-v="${c.id}">Full record</button></div></div>
    <div class="cgrid"><div>

        <div class="addrow"><input id="gnew" placeholder="Add a goal"><button class="btn sm" data-act="addgoal" data-v="${c.id}">Add</button></div></div>

            ${eventSteps(c,x)}${!past&&!x.rsvp_at?`<button class="btn sm ghost" data-act="wa" data-v="${c.id}" data-t="nudge" data-e="${e.id}">Nudge</button>`:''}${!past&&x.rsvp_at?`<button class="btn sm ghost" data-act="wa" data-v="${c.id}" data-t="remind" data-e="${e.id}">Remind</button>`:''}${past&&x.showed?`<button class="btn sm ghost" data-act="wa" data-v="${c.id}" data-t="after" data-e="${e.id}">Follow up</button>`:''}</div>`; }).join('')}</div>`
          :'<p class="muted" style="margin:0">No one yet. Invite people above, or sign-ups from this event\'s form land here after a sync.</p>'}

function exportCSV(){
  const cols = ['name','email','whatsapp','instagram','location','source','origin_note','sales_stage','cs_stage','owner','next_action','next_date','gender','meeting_country','home_country','secondary_country','initial_contact','message_result'];
  const cell = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const rows = Store.contacts().map(c=>[...cols.map(k=>cell(c[k])), cell(c.membership?TIERS_PLAN[c.membership.tier].label+(c.membership.status==='cancelled'?' (cancelled)':''):''), cell(c.membership?c.membership.price:''), cell(totalPaid(c)), cell(c.events.map(x=>(Store.getE(x.id)||{}).name).join('; '))].join(','));
  dl('lbyd-contacts-'+todayStr()+'.csv', [cols.concat(['tier','price_per_month','total_paid','events']).join(','), ...rows].join('\n'), 'text/csv');
}
function dl(name, content, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }

document.addEventListener('click', e => {
  if(e.target.closest('a[href]:not([href="#"])')) return;
  const el = e.target.closest('[data-act]'); if(!el) return;
  if(el.tagName==='A') e.preventDefault();
  const act = el.dataset.act, v = el.dataset.v, c = S.open ? Store.getC(S.open) : null, byId = id => Store.getC(id);
  switch(act){
    case 'gatepick': S.gatePick=v; render(); $('#pin').focus(); break;
    case 'login': if($('#pin').value.trim()===ROLES[S.gatePick].pin){ S.role=S.gatePick; S.tab=ROLES[S.role].home; render(); syncAll(false); } else $('#gerr').textContent="That PIN doesn't match. Check it and try again."; break;
    case 'logout': S.role=null; S.open=null; S.client=null; S.event=null; render(); break;
    case 'tab': S.tab=v; S.open=null; S.client=null; S.event=null; render(); window.scrollTo(0,0); break;
    case 'back': S.client=null; S.event=null; render(); break;
    case 'open': S.open=v; S.ptab='details'; S.modal=null; render(); break;
    case 'client': S.client=v; S.open=null; S.event=null; render(); window.scrollTo(0,0); break;
    case 'event': S.event=v; S.client=null; S.open=null; render(); window.scrollTo(0,0); break;
    case 'close': S.open=null; render(); break;
    case 'ptab': S.ptab=v; render(); break;
    case 'sync': syncAll(true); break;
    case 'wa': sendWA(byId(v), el.dataset.t, el.dataset.e ? Store.getE(el.dataset.e) : null); render(); break;
    case 'invitego': inviteTo(byId(v), Store.getE(el.dataset.e), true); render(); break;
    case 'invitepick': { const ev = Store.getE($('#invpick').value); inviteTo(byId(v), ev, !!el.dataset.send); render(); break; }
    case 'evinvite': { const x = byId($('#evinv').value); inviteTo(x, Store.getE(S.event), !!el.dataset.send); render(); break; }
    case 'step': setStep(byId(v), el.dataset.e, el.dataset.s); render(); break;
    case 'review': S.open=v; S.ptab='forms'; render(); break;
    case 'done': { const x = byId(v); x.last_contacted=Date.now(); if(x.next_date && x.next_date<=todayStr()) x.next_date=''; logTo(x,'Marked handled'); save(x,'Marked handled'); render(); break; }
    case 'serious': c.serious=!c.serious; logTo(c, c.serious?'Marked serious':'Serious flag removed'); save(c); render(); break;
    case 'copylink': copy(formLink(v, c)); break;
    case 'copyurl': copy(el.dataset.u); break;
    case 'addnote': { const x = el.dataset.cid ? byId(el.dataset.cid) : c, body = $('#nbody').value.trim(); if(!body){ toast('Write the note first'); return; } addNote(x, body, $('#ntag').value); render(); break; }
    case 'mtier': S.mTier=v; render(); break;
    case 'startmem': { const p = Number($('#mprice').value); if(!(p>0)){ toast('Set the monthly price first'); return; } startMembership(c, S.mTier, p, $('#mcourse').value, $('#mstart').value); render(); break; }
    case 'upgrade': { const p = Number($('#upprice').value); if(!(p>0)){ toast('Set the Premium price first'); return; } upgrade(c, p); render(); break; }
    case 'cancelmem': if(confirm('Cancel '+c.name+"'s membership? Their history stays, and you can restart it later.")){ cancelMembership(c); render(); } break;
    case 'restart': restartMembership(c); render(); break;
    case 'logpay': { const amt = Number($('#pamt').value); if(!(amt>0)){ toast('Enter an amount'); return; } logPayment(c, amt, $('#pdate').value, $('#pmeth').value); render(); break; }
    case 'archive': c.archived=!c.archived; logTo(c, c.archived?'Archived':'Restored'); save(c, c.archived?'Archived':'Restored'); render(); break;
    case 'goal': { const x = byId(el.dataset.cid), g = x.goals.find(y=>y.id===v); g.done=!g.done; logTo(x,(g.done?'Goal done: ':'Goal reopened: ')+g.text); save(x, g.done?'Goal done':'Goal reopened'); render(); break; }
    case 'addgoal': { const x = byId(v), t = $('#gnew').value.trim(); if(!t) return; x.goals.push({id:rid('g'), text:t, done:false, at:Date.now()}); logTo(x,'Goal set: '+t); save(x,'Goal added'); render(); break; }
    case 'todo': { const t = Store.tasks().find(y=>y.id===v); t.done=true; Store.putT(t); toast('Done'); render(); break; }
    case 'addtodo': { const t = $('#tnew').value.trim(); if(!t) return; Store.putT({id:rid('t'), text:t, due:$('#tdue').value, done:false, by:who(), at:Date.now()}); render(); break; }
    case 'add': S.modal={type:'add'}; render(); $('#a_name').focus(); break;
    case 'addevent': S.modal={type:'event'}; render(); $('#e_name').focus(); break;
    case 'cancel': S.modal=null; render(); break;
    case 'saveevent': {
      const name=$('#e_name').value.trim(), date=$('#e_date').value, form=$('#e_form').value.trim(), rep=Number($('#e_rep').value), cnt=rep?Number($('#e_cnt').value):1;
      if(!name||!date){ $('#eerr').textContent='Add a name and a date.'; return; }
      let firstId = null;
      for(let i=0;i<cnt;i++){
        const d = new Date(new Date(date).getTime() + i*rep*DAY);
        const ev = {id:rid('e'), name, date:localISO(d.getTime()).slice(0,16), type:$('#e_type').value, location:$('#e_loc').value.trim(), time_note:'',
          form_url:form, form_id:formId(form), tag:cnt>1?localISO(d.getTime()).slice(0,10):'', wa_link:$('#e_wa').value.trim(), recording:'', worked:'', didnt:'', notes:'', demo:false, created_at:Date.now()};
        Store.putE(ev); if(!firstId) firstId = ev.id;
      }
      S.modal=null; S.event=firstId; render(); toast(cnt>1?cnt+' events added. Update each WhatsApp group link as you go.':'Event added'); break; }
    case 'saveadd': {
      const f = {name:$('#a_name').value.trim(), whatsapp:$('#a_wa').value.trim(), instagram:$('#a_ig').value.trim(), email:$('#a_email').value.trim(), source:$('#a_src').value, origin_note:$('#a_origin').value.trim(), location:$('#a_loc').value.trim()};
      if(!f.name){ $('#aerr').textContent='Add a name to save this prospect.'; return; }
      if(!f.whatsapp && !f.instagram && !f.email){ $('#aerr').textContent='Add at least one way to reach them: WhatsApp, Instagram or email.'; return; }
      const m = findMatch(f);
      if(m){ const on = f.email&&normEmail(m.email)===normEmail(f.email)?'email':f.whatsapp&&normPhone(m.whatsapp)===normPhone(f.whatsapp)?'WhatsApp number':'Instagram handle'; S.modal={type:'dupe',id:m.id,on}; render(); return; }
      f.instagram = normIG(f.instagram);
      const n = blankContact(Object.assign(f, {owner:S.role, initial_contact:todayStr()}));
      logTo(n,'Added by hand'); save(n,'Prospect added'); S.modal=null; S.open=n.id; S.ptab='details'; render(); break; }
    case 'tag': S.tag=v; render(); break;
    case 'csv': exportCSV(); break;
    case 'json': dl('lbyd-backup-'+todayStr()+'.json', JSON.stringify(Store.dump(),null,2), 'application/json'); break;
    case 'reset': if(confirm('Reset the test data? Test contacts and events go back to how they started. Real people stay.')){ Store.reset(); S.open=null; S.client=null; S.event=null; render(); toast('Test data reset'); } break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id==='showtest'){ Store.prefs.showTest = el.checked; Store.savePrefs(); render(); return; }
  if(el.id==='filter'){ S.filter=el.value; $('#clist').innerHTML=contactsList(); return; }
  if(el.dataset.efield){ const ev = Store.getE(S.event); if(!ev) return; const k = el.dataset.efield; ev[k] = el.value.trim(); if(k==='form_url') ev.form_id = formId(ev[k]);
    Store.putE(ev); toast('Saved'); if(['name','date','type','wa_link','recording','form_url','location'].includes(k)) render(); return; }
  if(el.dataset.change==='cs' && el.dataset.cid){ setCS(Store.getC(el.dataset.cid), el.value); render(); return; }
  const c = S.open ? Store.getC(S.open) : null; if(!c) return;
  if(el.dataset.change==='stage'){
    if(['base','premium'].includes(el.value) && !isMember(c)){ S.ptab='membership'; S.mTier=el.value; render(); toast('Start their membership here'); return; }
    if(['base','premium'].includes(el.value) && isMember(c) && el.value!==c.membership.tier){ S.ptab='membership'; render(); toast(el.value==='premium'?'Use Upgrade to Premium here':'Change the tier here'); return; }
    setStage(c, el.value); render(); return; }
  if(el.dataset.change==='cs'){ setCS(c, el.value); render(); return; }
  if(el.dataset.field){
    const k = el.dataset.field, val = el.value.trim();
    if(['email','whatsapp','instagram'].includes(k) && val){ const m = findMatch({[k]:val}, c.id); if(m){ toast('That '+k+' already belongs to '+m.name); el.value=c[k]; return; } }
    if(k==='name' && !val){ toast("Name can't be empty"); el.value=c.name; return; }
    c[k] = k==='instagram' ? normIG(val) : val; if(k==='instagram') el.value=c[k];
    save(c,'Saved'); if(['name','origin_note','location','source'].includes(k)) { const pb=$('.pb'), y=pb?pb.scrollTop:0; render(); const pb2=$('.pb'); if(pb2) pb2.scrollTop=y; } return;
  }
  if(el.dataset.callf){
    c.call = c.call || {at:null, meet:'', outcome:'booked'}; const k = el.dataset.callf;
    if(k==='at') c.call.at = el.value ? new Date(el.value).getTime() : null; else if(k==='meet') c.call.meet = el.value.trim(); else c.call.outcome = el.value;
    if(c.call.at) bump(c,'call');
    logTo(c, k==='outcome' ? 'Call outcome: '+CALL_OUTCOMES.find(o=>o.id===el.value).label : 'Call updated'); save(c,'Saved'); render();
  }
});
document.addEventListener('input', e => { if(e.target.id==='q'){ S.q=e.target.value; $('#clist').innerHTML=contactsList(); } });
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ if(S.modal){S.modal=null;render();} else if(S.open){S.open=null;render();} }
  if(e.key==='Enter' && e.target.id==='pin') document.querySelector('[data-act="login"]').click();
  if(e.key==='Enter' && e.target.id==='tnew') document.querySelector('[data-act="addtodo"]').click();
  if(e.key==='Enter' && e.target.id==='gnew') document.querySelector('[data-act="addgoal"]').click();
});

Store.load();
render();

</script>
</body>
</html>
