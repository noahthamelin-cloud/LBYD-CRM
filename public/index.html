<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E3B30">
<title>LBYD CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* ---------- LOOK: Basalt (matches the onboarding deck) ---------- */
:root{
  --moss:#2E3B30; --moss2:#43554A; --moss3:#7D8F7E;
  --stone:#E3E2DA; --stone2:#D2D1C7; --paper:#F7F7F3;
  --ink:#1C221D; --mute:#666F68; --line:#CBCAC0;
  --ochre:#B9852F; --ochre-soft:#F0E3C6; --rust:#A4472F; --rust-soft:#F2DDD6; --ok:#4F7A45; --ok-soft:#DDE8D7;
  --f:'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--stone);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--moss2)}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* shell */
.demo{background:var(--ochre);color:#1C1A12;font-size:13px;padding:7px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.demo b{font-weight:700}
.app{display:grid;grid-template-columns:232px 1fr;min-height:calc(100% - 34px)}
.side{background:var(--moss);color:#E9EBE4}
.sidein{padding:22px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:21px;line-height:1.02;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:#AEBBAE;margin-top:6px;letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font-weight:500;color:#C9D1C6;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--moss2);color:#fff}
.nav button.on{background:#F7F7F3;color:var(--moss)}
.nav .n{font-size:12px;background:var(--ochre);color:#1C1A12;border-radius:20px;padding:1px 8px;font-weight:700}
.who{margin-top:auto;font-size:13px;color:#AEBBAE}
.who b{color:#fff;display:block;font-size:15px}
.main{padding:28px 32px 80px;max-width:1240px;width:100%}
.mtop{display:none}
h1{font-size:34px;line-height:1.05;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 22px}
h2{font-size:17px;font-weight:700;margin:26px 0 10px}

/* bits */
.btn{border:0;background:var(--moss);color:#fff;padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--moss2)}
.btn.ghost{background:transparent;color:var(--moss);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--paper)}
.btn.ochre{background:var(--ochre);color:#1C1A12}
.btn.danger{background:transparent;color:var(--rust);box-shadow:inset 0 0 0 1px var(--rust-soft)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--stone2);color:var(--ink);white-space:nowrap}
.chip.ochre{background:var(--ochre-soft);color:#6E4E14}
.chip.ok{background:var(--ok-soft);color:#2F4B29}
.chip.rust{background:var(--rust-soft);color:#7A2F1D}
.chip.moss{background:var(--moss);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:12px}
label.f>input,label.f>select,label.f>textarea{margin-top:4px;color:var(--ink);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.muted{color:var(--mute)}
.empty{padding:22px;text-align:center;color:var(--mute);background:var(--paper);border:1px dashed var(--line);border-radius:12px}

/* lists */
.list{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:#fff}
.row .nm{font-weight:600}
.row .meta{font-size:13px;color:var(--mute)}
.row .grow{flex:1;min-width:0}
.row .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.flag{color:var(--ochre);font-weight:800}

/* today */
.today{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.today section h2{margin-top:0;display:flex;justify-content:space-between;align-items:baseline}
.today section h2 span{font-size:13px;color:var(--mute);font-weight:500}

/* boards */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.col{min-width:236px;max-width:236px;background:var(--stone2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.col h3{margin:2px 4px 4px;font-size:14px;display:flex;justify-content:space-between}
.col h3 span{color:var(--mute);font-weight:500}
.card{background:var(--paper);border-radius:9px;padding:10px 11px;cursor:pointer;border:1px solid transparent}
.card:hover{border-color:var(--moss3)}
.card .nm{font-weight:600}
.card .meta{font-size:12px;color:var(--mute);margin-top:2px}
.card .chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}

/* toolbar */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar input{max-width:320px}
.bar select{width:auto}
.spacer{flex:1}

/* money */
.columns{background:var(--moss);color:#E9EBE4;border-radius:16px;padding:24px 26px 20px;margin-bottom:22px}
.columns .head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.columns .big{font-size:56px;font-weight:800;line-height:.9;letter-spacing:-.03em;color:#fff}
.columns .big small{font-size:16px;font-weight:500;color:#AEBBAE;letter-spacing:0;margin-left:8px}
.columns .next{font-size:14px;color:#C9D1C6;text-align:right}
.columns .next b{color:var(--ochre-soft)}
.basalt{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:190px}
.pillar{position:relative;background:#3B4A3E;border-radius:6px 6px 2px 2px;overflow:hidden;clip-path:polygon(0 8px,50% 0,100% 8px,100% 100%,0 100%)}
.pillar .fill{position:absolute;left:0;right:0;bottom:0;background:#E9EBE4;transition:height .9s cubic-bezier(.2,.7,.2,1)}
.pillar.done .fill{background:var(--ochre)}
.pillar.cur{box-shadow:inset 0 0 0 2px var(--ochre)}
.plabels{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:10px;font-size:12px;color:#AEBBAE}
.plabels b{display:block;color:#fff;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.01em}
.stat .k{font-size:13px;color:var(--mute)}
.split{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.split .track{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--stone2);margin:10px 0 8px}
.split .a{background:var(--moss)} .split .b{background:var(--ochre)}
.split .legend{display:flex;justify-content:space-between;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.funnel .fr{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.funnel .fb{height:10px;background:var(--moss3);border-radius:5px}

/* contact panel */
.scrim{position:fixed;inset:0;background:rgba(28,34,29,.42);z-index:30}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--stone);z-index:31;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(28,34,29,.18)}
.ph{background:var(--paper);padding:18px 22px 0;border-bottom:1px solid var(--line);padding-top:calc(18px + env(safe-area-inset-top,0px))}
.ph .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ph h2{font-size:28px;margin:0;font-weight:800;letter-spacing:-.02em}
.ph .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ph .ctl{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.ph .ctl select{width:auto}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;font-weight:600;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--moss);border-color:var(--moss)}
.pb{flex:1;overflow-y:auto;padding:20px 22px 40px}
.x{all:unset;cursor:pointer;font-size:24px;line-height:1;padding:4px 8px;color:var(--mute)}
.qa{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.qa .qh{display:flex;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);font-weight:700}
.qa dl{margin:0;padding:6px 16px 10px}
.qa dt{font-size:13px;color:var(--mute);margin-top:10px}
.qa dd{margin:2px 0 0;white-space:pre-wrap}
.note{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px}
.note .nt{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:4px;gap:8px}
.money3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.prog{height:8px;background:var(--stone2);border-radius:4px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--moss)}
.seg{display:flex;gap:6px;margin:4px 0 12px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--moss);color:#fff;border-color:var(--moss)}
.log{font-size:13px;border-left:2px solid var(--stone2);padding:2px 0 10px 12px}
.log b{font-weight:600}

/* modal + gate + toast */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:rgba(28,34,29,.42);padding:16px}
.mbox{background:var(--stone);border-radius:16px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px}
.mbox h2{margin:0 0 14px;font-size:22px}
.gate{min-height:100vh;display:grid;place-items:center;background:var(--moss);padding:20px}
.gbox{width:min(400px,100%);color:#E9EBE4}
.gbox .brand{font-size:44px;margin-bottom:28px}
.gbox .who{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.gbox .who button{border:1px solid #57695B;background:transparent;border-radius:10px;padding:12px;text-align:left;cursor:pointer;color:#E9EBE4}
.gbox .who button.on{background:#F7F7F3;color:var(--moss);border-color:#F7F7F3}
.gbox .who b{display:block;font-size:16px}
.gbox .who span{font-size:12px;opacity:.75}
.gbox input{background:#3B4A3E;border-color:#57695B;color:#fff;font-size:18px;letter-spacing:.2em;text-align:center;margin-bottom:10px}
.gbox .hint{font-size:12px;color:#AEBBAE;margin-top:14px}
.gbox .err{color:#F2C4B6;font-size:13px;min-height:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-size:14px}

/* mobile */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mtop{display:flex;justify-content:space-between;align-items:center;background:var(--moss);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
  .mtop .brand{font-size:17px}
  .main{padding:20px 14px 110px}
  h1{font-size:28px}
  .mnav{position:fixed;left:0;right:0;bottom:0;background:var(--moss);display:flex;overflow-x:auto;z-index:20;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .mnav button{all:unset;cursor:pointer;flex:1;min-width:72px;text-align:center;padding:8px 6px;border-radius:8px;color:#C9D1C6;font-size:12px;font-weight:600}
  .mnav button.on{background:#F7F7F3;color:var(--moss)}
  .grid2,.two{grid-template-columns:1fr}
  .basalt{height:140px;gap:6px}
  .plabels{gap:6px;font-size:10px}
  .plabels b{font-size:13px}
  .columns .big{font-size:44px}
  .today{grid-template-columns:1fr}
  .money3 .v{font-size:18px}
  .money3 .stat{padding:10px}
  .stats{grid-template-columns:1fr 1fr}
  .stat .v{font-size:21px}
}
@media (min-width:861px){.mnav{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script>
/* =========================================================================
   LBYD CRM (demo build)
   One file. No build step. Read MANUAL.md for the plain-language guide.

   Sections in this script:
     1. SETTINGS        what you will most often edit (forms, logins, stages, tiers, messages)
     2. STORAGE         where data lives. Demo = this browser. Live = Supabase (swap here only)
     3. DEMO DATA       the "Test 1" to "Test 16" contacts
     4. HELPERS         formatting, matching, links
     5. ACTIONS         everything that changes a contact
     6. SCREENS         Today, Pipeline, Clients, Contacts, Money, Insights, Settings
     7. CONTACT PANEL   the slide-out record
     8. EVENTS          clicks and edits
   ========================================================================= */

/* ---------- 1. SETTINGS ---------- */
const DEMO = true;   // shows the demo banner and the demo PINs on the login screen

const FORMS = {
  event:       'https://form.jotform.com/262708463844061',
  application: 'https://form.jotform.com/262762618270056',
  onboarding:  'https://form.jotform.com/262763667814065'
};

// Demo logins. In the live build these become real Supabase logins.
const ROLES = {
  noah:      {label:'Noah',      title:'Sales',          pin:'1001', home:'today',
              tabs:['today','pipeline','contacts','money','insights','settings']},
  abdullahi: {label:'Abdullahi', title:'Sales',          pin:'1002', home:'today',
              tabs:['today','pipeline','contacts','money','insights','settings']},
  brett:     {label:'Brett',     title:'CEO',            pin:'1003', home:'money',
              tabs:['money','today','pipeline','clients','contacts','insights','settings']},
  ryan:      {label:'Ryan',      title:'Client Success', pin:'1004', home:'today',
              tabs:['today','clients','contacts','money','insights','settings']}
};

const TAB_NAMES = {today:'Today',pipeline:'Pipeline',clients:'Clients',contacts:'Contacts',
                   money:'Money',insights:'Insights',settings:'Settings'};

const SALES_STAGES = [
  {id:'lead',       label:'Lead',       c:'#9AA39B'},
  {id:'invited',    label:'Invited',    c:'#9AA39B'},
  {id:'registered', label:'Registered', c:'#7D8F7E'},
  {id:'attended',   label:'Attended',   c:'#7D8F7E'},
  {id:'applied',    label:'Applied',    c:'#B9852F'},
  {id:'call',       label:'Sales call', c:'#B9852F'},
  {id:'sold',       label:'Sold',       c:'#4F7A45'},
  {id:'lost',       label:'Not a fit',  c:'#A4472F'}
];

const CS_STAGES = [
  {id:'onb_sent',  label:'Onboarding sent'},
  {id:'workbook',  label:'Workbook done'},
  {id:'onb_call',  label:'Onboarding call'},
  {id:'active',    label:'Active'},
  {id:'at_risk',   label:'At risk'},
  {id:'completed', label:'Completed'}
];

const SOURCES = ['Instagram','In person','Event','Referral','Skool','Other'];

const TAGS = {
  note:'Note', objection:'Objection', question:'Question',
  struggle:'Struggle', language:'Their words', faq:'FAQ'
};

const PLANS = {
  '6':  {label:'6 months',  price:5000},
  '12': {label:'12 months', price:8000}
};
const METHODS = ['Skool / Stripe','Bank transfer','Cash','Other'];

// Member goal tiers. Each one is its own 0 to N goal.
const TIERS = [
  {n:10,   name:'Founding Ten'},
  {n:50,   name:'The Circle'},
  {n:100,  name:'The Hundred'},
  {n:250,  name:'The Movement'},
  {n:500,  name:'The Collective'},
  {n:1000, name:'The Thousand'}
];

// Messages sent to clients on WhatsApp. Public-facing: no em dashes.
const MSG = {
  event:       "Hey [FIRST], here's the link to save your spot for Brett's free live session: [LINK]",
  application: "Hey [FIRST], great connecting. Here's the application for Live Before You Die. It takes about 5 minutes: [LINK]",
  onboarding:  "Welcome in, [FIRST]! Here's your onboarding workbook. Set aside about an hour somewhere quiet, and you can save and come back to it. Brett reads every answer before your onboarding call: [LINK]"
};

/* ---------- 2. STORAGE ----------
   Every screen talks to Store, never to storage directly. The demo keeps data in
   this browser. The live build replaces only this block with Supabase calls,
   where each contact is its own row, so one person's save never overwrites
   another's.                                                                 */
const Store = (() => {
  const KEY = 'lbyd_crm_demo_v1';
  let all = [];
  let mode = 'memory';
  function persist(){
    try{ localStorage.setItem(KEY, JSON.stringify(all)); mode='browser'; }
    catch(e){ mode='memory'; }
  }
  return {
    get mode(){ return mode; },
    load(){
      try{
        const raw = localStorage.getItem(KEY);
        all = raw ? JSON.parse(raw) : seed();
        mode = 'browser';
      }catch(e){ all = seed(); mode='memory'; }
      if(!all.length) all = seed();
      persist();
      return all;
    },
    list(){ return all; },
    get(id){ return all.find(c=>c.id===id); },
    put(c){
      c.updated_at = Date.now();
      const i = all.findIndex(x=>x.id===c.id);
      if(i<0) all.unshift(c); else all[i]=c;
      persist();
    },
    reset(){ all = seed(); persist(); }
  };
})();

/* ---------- 3. DEMO DATA ---------- */
const DAY = 86400000;
function blankContact(o){
  return Object.assign({
    id:'c'+Math.random().toString(36).slice(2,9), created_at:Date.now(), updated_at:Date.now(),
    name:'', email:'', whatsapp:'', instagram:'', location:'', source:'Instagram', event:'',
    owner:'noah', sales_stage:'lead', cs_stage:null, serious:false, hot_button:'',
    next_action:'', next_date:'', archived:false,
    submissions:[], notes:[], payments:[], deal:null, call:null, log:[]
  }, o);
}
function seed(){
  const t = Date.now(), ago = n => t - n*DAY, ahead = n => t + n*DAY;
  const iso = ms => { const d=new Date(ms); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
  const ev = (at,area,sit,ready,budget) => ({type:'event', at, key:{ready,budget}, answers:[
    ['Which area do you most want to change right now?', area],
    ['Where are you at right now?', sit],
    ['If the right program came along, are you in a position to invest in yourself in the next 30 days?', ready],
    ...(budget ? [['How much are you able to invest in yourself?', budget]] : []),
    ['Event', '2026-10-07']]});
  const app = (at,o) => ({type:'application', at, key:{ready:o.ready, budget:o.budget, commitment:o.commit}, answers:[
    ['Where are you based right now?', o.based],
    ['What do you do right now for work or business?', o.work],
    ['What is your current monthly income?', o.income],
    ['What areas of your life are you most interested in improving?', o.areas],
    ['What are you struggling with most in those areas right now?', o.struggle],
    ['What made you want to apply?', o.why],
    ['What would a big win look like for you 12 months from now?', o.win],
    ['On a scale of 1 to 10, how committed are you to making this change?', String(o.commit)],
    ["If you're accepted, are you in a position to invest in yourself in the next 30 days?", o.ready],
    ...(o.budget ? [['How much are you able to invest in yourself?', o.budget]] : []),
    ['Is anyone else involved in this decision, like a partner or family member?', o.decision]]});
  const wb = at => ({type:'onboarding', at, key:{}, answers:[
    ['What do you do right now, and what does a normal week look like?', 'Sample answer. Runs a small coaching practice, works 50 hours a week, mostly delivery.'],
    ['Rate each area from 1 to 10', 'Money 5, Relationships 6, Health 4, Purpose 7, Friendships 5'],
    ["If money wasn't an issue, what would you BUILD?", 'Sample answer. A retreat business in Bali running four retreats a year.'],
    ['Why does this vision matter to you?', 'Sample answer. Freedom. Then: proving I can. Then: showing my kids it is possible.'],
    ['What is the gap between where you are today and your vision?', 'Sample answer. No offer, no audience, too much time on low-value work.'],

/* ---------- 4. HELPERS ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Math.round(Number(n)||0).toLocaleString('en-US');
const fmtDate = ms => ms ? new Date(ms).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
const fmtWhen = ms => ms ? new Date(ms).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '';
const todayStr = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const startToday = () => { const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const daysSince = ms => Math.floor((Date.now()-ms)/DAY);
const ago = ms => { const d=daysSince(ms); return d<=0?'today':d===1?'yesterday':d+' days ago'; };
const first = n => String(n||'').trim().split(/\s+/)[0] || 'there';
const stage = id => SALES_STAGES.find(s=>s.id===id) || SALES_STAGES[0];
const csStage = id => CS_STAGES.find(s=>s.id===id);
const who = () => ROLES[S.role].label;
const lastActivity = c => Math.max(c.updated_at||0, (c.log[0]||{}).at||0);
const live = () => Store.list().filter(c=>!c.archived);

// Matching rules, used when adding a contact (and by the form intake in the live build).
// Order: email, then full WhatsApp number, then Instagram handle.
const normPhone = v => String(v||'').replace(/\D/g,'');
const normIG = v => String(v||'').trim().toLowerCase().replace(/^@/,'').replace(/\s/g,'');
const normEmail = v => String(v||'').trim().toLowerCase();
function findMatch(f, exceptId){
  const e = normEmail(f.email), p = normPhone(f.whatsapp), i = normIG(f.instagram);
  return Store.list().find(c => c.id!==exceptId && (
    (e && normEmail(c.email)===e) ||
    (p.length>=8 && normPhone(c.whatsapp)===p) ||
    (i && normIG(c.instagram)===i)));
}

function latestKey(c,k){
  for(const s of [...c.submissions].sort((a,b)=>b.at-a.at)) if(s.key && s.key[k]) return s.key[k];
  return '';
}
function paid(c){ return c.payments.reduce((a,p)=>a+(Number(p.amount)||0),0); }
function owed(c){ return c.deal ? Math.max(0, c.deal.price - paid(c)) : 0; }

function formLink(type, c){
  const parts = String(c.name||'').trim().split(/\s+/);
  const q = new URLSearchParams();
  if(type!=='event'){ q.set('crm_id', c.id); q.set('source','crm'); }
  if(c.email) q.set('email', c.email);
  if(parts[0]) q.set('full_name[first]', parts[0]);
  if(parts.length>1) q.set('full_name[last]', parts.slice(1).join(' '));
  return FORMS[type] + '?' + q.toString();
}
function waUrl(phone, text){
  const d = normPhone(phone);
  return 'https://wa.me/' + (d||'') + '?text=' + encodeURIComponent(text);
}
function msgFor(type, c){ return MSG[type].replace('[FIRST]', first(c.name)).replace('[LINK]', formLink(type,c)); }

function toast(m){
  const t = $('#toast'); t.innerHTML = '<div class="toast">'+esc(m)+'</div>';
  clearTimeout(toast.t); toast.t = setTimeout(()=>t.innerHTML='', 2200);
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast('Link copied'); }
  catch(e){ prompt('Copy this link:', text); }
}

/* ---------- 5. ACTIONS ---------- */
function logTo(c, body){ c.log.unshift({at:Date.now(), by:who(), body}); }
function save(c, msg){ Store.put(c); if(msg) toast(msg); }

function setStage(c, id){
  if(c.sales_stage===id) return;
  logTo(c, 'Stage: '+stage(c.sales_stage).label+' to '+stage(id).label);
  c.sales_stage = id;
  save(c, 'Moved to '+stage(id).label);
}
function setCS(c, id){
  logTo(c, 'Client stage: '+(csStage(c.cs_stage)||{label:'Not sent'}).label+' to '+csStage(id).label);
  c.cs_stage = id; save(c, 'Moved to '+csStage(id).label);
}
function sendForm(c, type){
  window.open(waUrl(c.whatsapp, msgFor(type,c)), '_blank', 'noopener');
  const names = {event:'Event invite', application:'Application', onboarding:'Onboarding workbook'};
  logTo(c, names[type]+' sent on WhatsApp');
  if(type==='event' && c.sales_stage==='lead') c.sales_stage='invited';
  if(type==='onboarding' && !c.cs_stage){ c.cs_stage='onb_sent'; c.onb_sent_at=Date.now(); }
  save(c, names[type]+' sent');
}
function closeDeal(c, plan, price, pay){
  c.deal = {plan, price:Number(price)||PLANS[plan].price, pay, at:Date.now()};
  logTo(c, 'Closed: '+PLANS[plan].label+', '+money(c.deal.price)+', '+(pay==='full'?'paid in full':'payment plan'));
  c.sales_stage = 'sold';
  save(c, 'Deal closed. Log the first payment next.');
}
function logPayment(c, amount, date, method){
  const at = date ? new Date(date+'T12:00:00').getTime() : Date.now();
  c.payments.unshift({id:'p'+Math.random().toString(36).slice(2,8), at, amount:Number(amount), method});
  logTo(c, 'Payment logged: '+money(amount)+' ('+method+')');
  save(c, 'Payment logged');
}
function addNote(c, body, tag){
  c.notes.unshift({id:'n'+Math.random().toString(36).slice(2,8), at:Date.now(), by:who(), tag, body});
  save(c, 'Note added');
}

    <div class="stats">
      <div class="stat"><div class="v">${money(collected)}</div><div class="k">Cash collected</div></div>
      <div class="stat"><div class="v">${money(contracted)}</div><div class="k">Contracted</div></div>
      <div class="stat"><div class="v">${money(outstanding)}</div><div class="k">Still owed on plans</div></div>
      <div class="stat"><div class="v">${members}</div><div class="k">Deals closed</div></div>
      <div class="stat"><div class="v">${money(avg)}</div><div class="k">Average deal</div></div>
    </div>
    <h2>How people are buying</h2>
    <div class="two">${split('Commitment', six,'6 months', twelve,'12 months')}${split('Payment', full,'Paid in full', plan,'Payment plan')}</div>
    <div class="two" style="margin-top:12px">
      <div class="split funnel"><b>Funnel</b><div style="margin-top:8px">${order.map(id=>{const n=reached(id);return `<div class="fr"><span>${esc(stage(id).label)}</span><div class="fb" style="width:${Math.max(2,n/top*100)}%"></div><span class="muted">${n}</span></div>`;}).join('')}</div></div>
      <div class="split"><b>Owed on payment plans</b>${owedList.length?`<div class="list" style="margin-top:10px">${owedList.map(c=>contactRow(c, money(paid(c))+' paid of '+money(c.deal.price)+' · '+money(owed(c))+' owed')).join('')}</div>`:`<p class="muted">Nothing outstanding.</p>`}</div>
    </div>`;
}

function viewInsights(){
  const notes = [];
  live().forEach(c=>c.notes.forEach(n=>{ if(n.tag!=='note') notes.push({...n, c}); }));
  notes.sort((a,b)=>b.at-a.at);
  const counts = {}; notes.forEach(n=>counts[n.tag]=(counts[n.tag]||0)+1);
  const shown = S.tag==='all' ? notes : notes.filter(n=>n.tag===S.tag);
  return `<h1>Insights</h1><p class="sub">Every objection, question and struggle across all contacts. This is the content idea bank.</p>
    <div class="bar">${[['all','All',notes.length],...Object.entries(TAGS).filter(([k])=>k!=='note').map(([k,l])=>[k,l,counts[k]||0])]
      .map(([k,l,n])=>`<button class="btn sm ${S.tag===k?'':'ghost'}" data-act="tag" data-v="${k}">${esc(l)} · ${n}</button>`).join('')}</div>
    ${shown.length?shown.map(n=>`<div class="note"><div class="nt"><span><span class="chip">${esc(TAGS[n.tag])}</span> ${esc(fmtDate(n.at))} · ${esc(n.by)}</span>
      <a href="#" data-act="open" data-v="${n.c.id}">${esc(n.c.name)}</a></div>${esc(n.body)}</div>`).join('')
      :`<div class="empty">Nothing tagged yet. When you add a note to a contact, tag it as an objection, question or struggle and it lands here.</div>`}`;
}

function viewSettings(){
  return `<h1>Settings</h1><p class="sub">Exports, form links and the demo controls.</p>
    <h2>Back up</h2><p class="muted">Download everything. Do this before any big change.</p>
    <div class="bar"><button class="btn ghost" data-act="csv">Download CSV</button><button class="btn ghost" data-act="json">Download full backup (JSON)</button></div>
    <h2>Forms</h2><div class="list">${Object.entries(FORMS).map(([k,u])=>`<div class="row" style="cursor:default"><div class="grow"><div class="nm">${esc({event:'Event sign-up',application:'Program application',onboarding:'Onboarding workbook'}[k])}</div><div class="meta">${esc(u)}</div></div><a class="btn sm ghost" href="${esc(u)}" target="_blank" rel="noopener">Open</a></div>`).join('')}</div>
    <h2>Storage</h2><p class="muted">${DEMO?'Demo mode. Data is saved in this browser only, so each person sees their own copy. The live version saves to one shared database.':'Connected to the shared database.'}</p>
    ${DEMO?`<button class="btn danger" data-act="reset">Reset demo data</button>`:''}`;
}

/* ---------- 7. CONTACT PANEL ---------- */
function viewPanel(){
  const c = Store.get(S.open); if(!c) return '';
  const s = stage(c.sales_stage);
  const commit = latestKey(c,'commitment');
  const tabs = [['details','Details'],['forms','Forms'+(c.submissions.length?' · '+c.submissions.length:'')],
    ['notes','Notes'+(c.notes.length?' · '+c.notes.length:'')],['money','Payments'],['activity','Activity']];
  const body = {details:panelDetails, forms:panelForms, notes:panelNotes, money:panelMoney, activity:panelActivity}[S.ptab](c);
  return `<div class="scrim" data-act="close"></div>
  <aside class="panel" role="dialog" aria-label="${esc(c.name)}">
    <div class="ph">
      <div class="top"><h2>${esc(c.name)}</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
      <div class="chips">
        <span class="chip" style="background:${s.c};color:#fff">${esc(s.label)}</span>
        ${c.cs_stage?`<span class="chip moss">${esc(csStage(c.cs_stage).label)}</span>`:''}
        ${chipBudget(c)}${commit?`<span class="chip">Commitment ${esc(commit)}/10</span>`:''}
        ${c.hot_button?`<span class="chip ochre">${esc(c.hot_button)}</span>`:''}
        ${c.archived?'<span class="chip rust">Archived</span>':''}
      </div>
      <div class="ctl">
        <select data-change="stage" aria-label="Sales stage">${SALES_STAGES.map(x=>`<option value="${x.id}" ${x.id===c.sales_stage?'selected':''}>${esc(x.label)}</option>`).join('')}</select>
        ${c.sales_stage==='sold'?`<select data-change="cs" aria-label="Client stage"><option value="" disabled ${!c.cs_stage?'selected':''}>Client stage</option>${CS_STAGES.map(x=>`<option value="${x.id}" ${x.id===c.cs_stage?'selected':''}>${esc(x.label)}</option>`).join('')}</select>`:''}
        <button class="btn sm ${c.serious?'ochre':'ghost'}" data-act="serious">${c.serious?'★ Serious':'☆ Mark serious'}</button>
      </div>
      <div class="acts">
        ${c.whatsapp?`<a class="btn sm ghost" href="https://wa.me/${normPhone(c.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>`:''}
        ${['lead','invited'].includes(c.sales_stage)?sendBtns(c,'event','Send event invite'):''}
        ${!['sold','lost'].includes(c.sales_stage)&&!c.submissions.some(x=>x.type==='application')?sendBtns(c,'application','Send application'):''}
        ${c.sales_stage==='sold'?sendBtns(c,'onboarding','Send onboarding'):''}
        ${c.call&&c.call.meet&&c.call.at>=startToday()&&c.sales_stage!=='sold'?`<a class="btn sm" href="${esc(c.call.meet)}" target="_blank" rel="noopener">Join call · ${esc(fmtWhen(c.call.at))}</a>`:''}
      </div>
      <div class="tabs">${tabs.map(([k,l])=>`<button class="${S.ptab===k?'on':''}" data-act="ptab" data-v="${k}">${l}</button>`).join('')}</div>
    </div>
    <div class="pb">${body}</div>
  </aside>`;
}
function sendBtns(c,type,label){
  return `<button class="btn sm" data-act="send" data-v="${type}">${label}</button><button class="btn sm ghost" data-act="copylink" data-v="${type}" title="Copy link">Copy link</button>`;
}
function field(c,k,label,type){
  return `<label class="f">${label}<input data-field="${k}" type="${type||'text'}" value="${esc(c[k])}"></label>`;
}
function panelDetails(c){
  const callAt = c.call && c.call.at ? new Date(c.call.at - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : '';
  return `<div class="grid2">
    ${field(c,'name','Name')}${field(c,'whatsapp','WhatsApp (with country code)','tel')}
    ${field(c,'email','Email','email')}${field(c,'instagram','Instagram')}
    ${field(c,'location','Based in')}
    <label class="f">Source<select data-field="source">${SOURCES.map(x=>`<option ${x===c.source?'selected':''}>${x}</option>`).join('')}</select></label>
    ${field(c,'event','Event (date)')}
    <label class="f">Owner<select data-field="owner">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${k===c.owner?'selected':''}>${esc(r.label)}</option>`).join('')}</select></label>
  </div>
  ${field(c,'hot_button','Hot button (what they really want)')}
  <div class="grid2">${field(c,'next_action','Next action')}${field(c,'next_date','Next action date','date')}</div>
  <h2 style="margin-top:8px">Sales call</h2>
  <div class="grid2">
    <label class="f">Date and time<input data-callf="at" type="datetime-local" value="${callAt}"></label>
    <label class="f">Google Meet link<input data-callf="meet" type="url" value="${esc(c.call&&c.call.meet||'')}" placeholder="Fills in from Cal.com when live"></label>
  </div>
  <div style="margin-top:20px"><button class="btn danger sm" data-act="archive">${c.archived?'Restore contact':'Archive contact'}</button>
  <p class="muted" style="font-size:13px">Archiving hides a contact. Nothing is ever deleted.</p></div>`;
}
function panelForms(c){
  if(!c.submissions.length) return `<div class="empty">No forms in yet. Send the event invite or application from the buttons above. Their answers land here.</div>`;
  const names = {event:'Event sign-up', application:'Program application', onboarding:'Onboarding workbook'};
  return [...c.submissions].sort((a,b)=>b.at-a.at).map(s=>`<div class="qa"><div class="qh"><span>${names[s.type]}</span><span class="muted" style="font-weight:500">${fmtDate(s.at)}</span></div>
    <dl>${s.answers.map(([q,a])=>`<dt>${esc(q)}</dt><dd>${esc(a)||'<span class="muted">No answer</span>'}</dd>`).join('')}</dl></div>`).join('');
}
function panelNotes(c){
  return `<label class="f">New note<textarea id="nbody" placeholder="What did you learn? Objections, questions, the exact words they used."></textarea></label>
    <div class="bar"><select id="ntag" style="width:auto">${Object.entries(TAGS).map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join('')}</select>
    <button class="btn" data-act="addnote">Add note</button></div>
    ${c.notes.map(n=>`<div class="note"><div class="nt"><span>${n.tag!=='note'?`<span class="chip">${esc(TAGS[n.tag])}</span> `:''}${esc(n.by)}</span><span>${esc(fmtDate(n.at))}</span></div>${esc(n.body)}</div>`).join('')||'<p class="muted">No notes yet.</p>'}`;
}
function panelMoney(c){
  if(!c.deal){
    const plan = S.closePlan, pay = S.closePay;
    return `<p class="muted">No deal yet. When they say yes, close it here. This marks them Sold and adds them to the member count.</p>
      <b>Program</b><div class="seg">${Object.entries(PLANS).map(([k,p])=>`<button class="${plan===k?'on':''}" data-act="cplan" data-v="${k}">${p.label} · ${money(p.price)}</button>`).join('')}</div>
      <label class="f">Price (change it for a custom deal)<input id="cprice" type="number" value="${PLANS[plan].price}"></label>
      <b>How they're paying</b><div class="seg"><button class="${pay==='full'?'on':''}" data-act="cpay" data-v="full">Paid in full</button><button class="${pay==='plan'?'on':''}" data-act="cpay" data-v="plan">Payment plan</button></div>
      <button class="btn ochre" data-act="closedeal">Close the deal</button>`;
  }
  const p = paid(c), o = owed(c), pct = Math.min(100, Math.round(p/c.deal.price*100));
  return `<div class="money3">
      <div class="stat"><div class="v">${money(c.deal.price)}</div><div class="k">${esc(PLANS[c.deal.plan].label)}, ${c.deal.pay==='full'?'in full':'on a plan'}</div></div>
      <div class="stat"><div class="v">${money(p)}</div><div class="k">Collected</div></div>
      <div class="stat"><div class="v">${money(o)}</div><div class="k">Still owed</div></div></div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <h2 style="margin-top:0">Log a payment</h2>
    <div class="grid2"><label class="f">Amount<input id="pamt" type="number" value="${o||''}"></label><label class="f">Date<input id="pdate" type="date" value="${todayStr()}"></label></div>
    <label class="f">Method<select id="pmeth">${METHODS.map(m=>`<option>${m}</option>`).join('')}</select></label>
    <button class="btn" data-act="logpay">Log payment</button>
    <h2>Payments</h2>
    ${c.payments.length?`<div class="list">${c.payments.map(x=>`<div class="row" style="cursor:default"><div class="grow"><div class="nm">${money(x.amount)}</div><div class="meta">${esc(fmtDate(x.at))} · ${esc(x.method)}</div></div></div>`).join('')}</div>`:'<p class="muted">No payments logged yet.</p>'}`;
}
function panelActivity(c){
  return c.log.map(l=>`<div class="log"><b>${esc(l.body)}</b><div class="muted">${esc(l.by)} · ${esc(fmtWhen(l.at))}</div></div>`).join('') || '<p class="muted">No activity yet.</p>';
}

function viewModal(){
  if(S.modal.type==='add') return `<div class="modal"><div class="mbox">
    <h2>Add contact</h2>
    <p class="muted" style="margin-top:-8px">For anyone you meet in person or who didn't come through a form.</p>
    <label class="f">Name<input id="a_name" autocomplete="off"></label>
    <div class="grid2"><label class="f">WhatsApp (with country code)<input id="a_wa" type="tel" placeholder="+62 812..."></label>
    <label class="f">Instagram<input id="a_ig" placeholder="@handle"></label></div>
    <div class="grid2"><label class="f">Email<input id="a_email" type="email"></label>
    <label class="f">Source<select id="a_src">${SOURCES.map(x=>`<option ${x==='In person'?'selected':''}>${x}</option>`).join('')}</select></label></div>
    <label class="f">Where did you meet / what do they want?<input id="a_hot" placeholder="Hot button"></label>
    <div class="err" id="aerr" style="color:var(--rust);min-height:20px;font-size:14px"></div>
    <div class="bar"><button class="btn" data-act="saveadd">Save contact</button><button class="btn ghost" data-act="cancel">Cancel</button></div>
  </div></div>`;
  if(S.modal.type==='dupe'){ const d = Store.get(S.modal.id); return `<div class="modal"><div class="mbox">
    <h2>${esc(d.name)} is already in the CRM</h2>
    <p>Their ${esc(S.modal.on)} matches what you entered, so no new record was made. Open theirs to add notes or update it.</p>
    <div class="bar"><button class="btn" data-act="open" data-v="${d.id}">Open ${esc(first(d.name))}'s record</button><button class="btn ghost" data-act="cancel">Cancel</button></div>
  </div></div>`; }
  return '';
}

/* ---------- 8. EVENTS ---------- */
function exportCSV(){
  const cols = ['name','email','whatsapp','instagram','location','source','event','sales_stage','cs_stage','serious','hot_button','owner','next_action','next_date'];
  const cell = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const rows = Store.list().map(c=>[...cols.map(k=>cell(c[k])), cell(c.deal?c.deal.price:''), cell(paid(c))].join(','));
  dl('lbyd-contacts-'+todayStr()+'.csv', [cols.concat(['deal_price','paid']).join(','), ...rows].join('\n'), 'text/csv');
}
function dl(name, content, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  const c = S.open ? Store.get(S.open) : null;
  if(el.tagName==='A' && el.getAttribute('href')==='#') e.preventDefault();
  switch(act){
    case 'gatepick': S.gatePick = v; render(); $('#pin').focus(); break;
    case 'login': {
      const k = S.gatePick || 'noah';
      if($('#pin').value.trim()===ROLES[k].pin){ S.role=k; S.tab=ROLES[k].home; render(); }
      else $('#gerr').textContent = "That PIN doesn't match. Check it and try again.";
      break; }
    case 'logout': S.role=null; S.open=null; render(); break;
    case 'tab': S.tab=v; S.open=null; render(); window.scrollTo(0,0); break;
    case 'open': S.open=v; S.ptab='details'; S.modal=null; render(); break;
    case 'close': S.open=null; render(); break;
    case 'ptab': S.ptab=v; render(); break;
    case 'serious': c.serious=!c.serious; logTo(c, c.serious?'Marked serious':'Serious flag removed'); save(c); render(); break;
    case 'send': sendForm(c, v); render(); break;
    case 'copylink': copy(formLink(v,c)); break;
    case 'addnote': {
      const body = $('#nbody').value.trim(); if(!body){ toast('Write the note first'); return; }
      addNote(c, body, $('#ntag').value); render(); break; }
    case 'cplan': S.closePlan=v; render(); break;
    case 'cpay': S.closePay=v; render(); break;
    case 'closedeal': closeDeal(c, S.closePlan, $('#cprice').value, S.closePay); render(); break;
    case 'logpay': {
      const amt = Number($('#pamt').value); if(!(amt>0)){ toast('Enter an amount'); return; }
      logPayment(c, amt, $('#pdate').value, $('#pmeth').value); render(); break; }
    case 'archive': c.archived=!c.archived; logTo(c, c.archived?'Archived':'Restored'); save(c, c.archived?'Archived':'Restored'); render(); break;
    case 'add': S.modal={type:'add'}; render(); $('#a_name').focus(); break;
    case 'cancel': S.modal=null; render(); break;
    case 'saveadd': {
      const f = {name:$('#a_name').value.trim(), whatsapp:$('#a_wa').value.trim(), instagram:$('#a_ig').value.trim(),
                 email:$('#a_email').value.trim(), source:$('#a_src').value, hot_button:$('#a_hot').value.trim()};
      if(!f.name){ $('#aerr').textContent='Add a name to save this contact.'; return; }
      if(!f.whatsapp && !f.instagram && !f.email){ $('#aerr').textContent='Add at least one way to reach them: WhatsApp, Instagram or email.'; return; }
      const m = findMatch(f);
      if(m){
        const on = normEmail(m.email)===normEmail(f.email)&&f.email ? 'email' : normPhone(m.whatsapp)===normPhone(f.whatsapp)&&f.whatsapp ? 'WhatsApp number' : 'Instagram handle';
        S.modal={type:'dupe', id:m.id, on}; render(); return;
      }
      f.instagram = normIG(f.instagram);
      const n = blankContact(Object.assign(f, {owner:S.role==='ryan'?'noah':S.role}));
      logTo(n, 'Added by hand');
      save(n, 'Contact added'); S.modal=null; S.open=n.id; S.ptab='details'; render(); break; }
    case 'tag': S.tag=v; render(); break;
    case 'csv': exportCSV(); break;
    case 'json': dl('lbyd-backup-'+todayStr()+'.json', JSON.stringify(Store.list(),null,2), 'application/json'); break;
    case 'reset': if(confirm('Reset the demo? This puts the Test 1 to Test 16 contacts back and clears anything you added.')){ Store.reset(); S.open=null; render(); toast('Demo reset'); } break;
  }
});

document.addEventListener('change', e => {
  const c = S.open ? Store.get(S.open) : null;
  const el = e.target;
  if(el.id==='filter'){ S.filter=el.value; $('#clist').innerHTML=contactsList(); return; }
  if(!c) return;
  if(el.dataset.change==='stage'){
    if(el.value==='sold' && !c.deal){ S.ptab='money'; render(); toast('Close the deal here to mark them Sold'); return; }
    setStage(c, el.value); render(); return; }
  if(el.dataset.change==='cs'){ setCS(c, el.value); render(); return; }
  if(el.dataset.field){
    const k = el.dataset.field, val = el.value.trim();
    if(['email','whatsapp','instagram'].includes(k) && val){
      const m = findMatch({[k]:val}, c.id);
      if(m){ toast('That '+k+' already belongs to '+m.name); el.value=c[k]; return; }
    }
    if(k==='name' && !val){ toast('Name can\'t be empty'); el.value=c.name; return; }
    c[k] = k==='instagram' ? normIG(val) : val;
    if(k==='instagram') el.value = c[k];
    save(c, 'Saved');
    if(k==='name'){ const h=document.querySelector('.ph h2'); if(h) h.textContent=val; }
    return;
  }
  if(el.dataset.callf){
    c.call = c.call || {at:null, meet:''};
    if(el.dataset.callf==='at') c.call.at = el.value ? new Date(el.value).getTime() : null;
    else c.call.meet = el.value.trim();
    if(!c.call.at && !c.call.meet) c.call = null;
    if(c.call && c.call.at && ['applied','registered','attended','invited','lead'].includes(c.sales_stage)) c.sales_stage='call';
    logTo(c, 'Sales call updated'); save(c, 'Saved'); render();
  }
});

document.addEventListener('input', e => {
  if(e.target.id==='q'){ S.q=e.target.value; $('#clist').innerHTML=contactsList(); }
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ if(S.modal){S.modal=null;render();} else if(S.open){S.open=null;render();} }
  if(e.key==='Enter' && e.target.id==='pin') document.querySelector('[data-act="login"]').click();
});

Store.load();
render();
</script>
</body>
</html>
